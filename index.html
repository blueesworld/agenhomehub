<html lang="de">

<style>
*{margin:0;padding:0;-webkit-box-sizing:border-box;box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0)}
html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:pointer;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.light{color:#111}
input,textarea,select{-webkit-user-select:text;user-select:text;color:#fff;font-family:inherit;font-size:17px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:9px 12px;outline:none;-webkit-appearance:none;width:100%}
body.light input,body.light textarea,body.light select{color:#111;background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.15)}
select option{color:#000}
textarea{resize:none}
.hide{display:none!important}
#rot{position:absolute;left:0;top:0;width:100%;height:100%;background:#000;color:#fff;text-align:center;padding-top:40%;font-size:24px;display:none;z-index:999}
body.portrait #rot{display:block}
#stage{position:absolute;left:0;top:0;width:1024px;height:768px;overflow:hidden;-webkit-transform-origin:0 0;transform-origin:0 0}
#wall{position:absolute;left:0;top:0;width:1024px;height:768px}
#wimg{position:absolute;left:0;top:0;width:1024px;height:768px;display:none}
.wp0{background:-webkit-linear-gradient(top,#e9a878,#8a4f36)}
.wp1{background:-webkit-linear-gradient(top,#2a4ea8,#080b22)}
.wp2{background:-webkit-linear-gradient(top,#5b2a4f,#140912)}
.wp3{background:-webkit-linear-gradient(top,#dfe6f3,#7d8db0)}
#dim{position:absolute;left:0;top:0;width:1024px;height:768px;background:#000;opacity:0;pointer-events:none;z-index:80}
.gl{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);border-radius:26px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 8px 24px rgba(0,0,0,.22)}
body.light .gl{background:rgba(255,255,255,.72);border-color:rgba(255,255,255,.9)}
.dk{background:rgba(18,22,38,.74)!important;border-color:rgba(255,255,255,.2)!important}
body.light .dk{background:rgba(245,246,250,.94)!important}
.acc{background:#0a84ff !important;color:#fff !important}
.btn{display:inline-block;padding:11px 20px;border-radius:99px;background:rgba(255,255,255,.28);font-size:16px;font-weight:600;text-align:center;margin:4px 4px 4px 0;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.btn:active{opacity:.6}
.btn.acc{color:#fff}
.row{background:rgba(255,255,255,.14);border-radius:18px;padding:13px 16px;margin-bottom:10px;font-size:17px}
.row:after{content:"";display:block;clear:both}
.row small{display:block;font-size:13px;color:rgba(255,255,255,.7);margin-top:3px}
body.light .row small{color:rgba(0,0,0,.55)}
.r{float:right}
.note{font-size:14px;color:rgba(255,255,255,.72);margin:10px 4px;line-height:1.45}
body.light .note{color:rgba(0,0,0,.55)}
.sec{font-size:13px;color:rgba(255,255,255,.7);text-transform:uppercase;margin:18px 4px 8px}
.big{font-size:96px;font-weight:200;text-align:center;letter-spacing:-3px;margin:8px 0;line-height:1.1}
.addrow{margin-bottom:12px}
.addrow input{width:auto;display:inline-block;margin:4px 6px 4px 0}
.sw2{display:inline-block;width:52px;height:32px;border-radius:16px;background:rgba(120,120,128,.6);position:relative;float:right;margin-left:10px}
.sw2 .kn{position:absolute;left:2px;top:2px;width:28px;height:28px;border-radius:14px;background:#fff;-webkit-transition:left .2s;transition:left .2s}
.sw2.on{background:#34c759}
.sw2.on .kn{left:22px}
.wpp{display:inline-block;width:52px;height:52px;border-radius:26px;margin:4px 6px;border:3px solid transparent;vertical-align:middle;cursor:pointer}
.wpp.sel{border-color:#fff}
.swc{display:inline-block;width:34px;height:34px;border-radius:17px;border:3px solid transparent;margin:0 4px;vertical-align:middle;cursor:pointer}
.swc.sel{border-color:#fff}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:#0a84ff}
.tabs{margin-bottom:12px}
.tabs .btn{width:31%;text-align:center;margin:0 1% 0 0}
.tabs .btn.on{background:rgba(255,255,255,.4)}
.lvl{display:inline-block;width:30px;height:30px;border-radius:15px;background:rgba(255,255,255,.3);margin:0 5px;cursor:pointer;vertical-align:middle}
.lvl.on{background:#0a84ff}
.lvls{text-align:center;margin-top:6px}
.big2{font-size:84px;font-weight:200;text-align:center;line-height:1;margin:4px 0}
.big3{font-size:44px;font-weight:300;line-height:1.1}
.ctr{text-align:center;margin-top:6px}
.ibtn{display:inline-block;margin:0 8px;vertical-align:middle;cursor:pointer}
.wline{font-size:15px;margin-top:4px}
.small2{font-size:14px;color:rgba(255,255,255,.7)}
.chk{display:inline-block;width:26px;height:26px;border-radius:13px;border:2px solid rgba(255,255,255,.6);text-align:center;line-height:22px;font-size:15px;margin-right:10px;vertical-align:middle}
.chk.on{background:#0a84ff;border-color:#0a84ff}
.cells{text-align:center}
.cbtn{display:inline-block;width:22%;height:66px;margin:6px 1%;border-radius:20px;background:rgba(255,255,255,.22);font-size:24px;line-height:66px;text-align:center;cursor:pointer;vertical-align:top}
.cbtn.op{background:#0a84ff}
.bubble{max-width:80%;padding:11px 14px;border-radius:18px;margin-bottom:8px;font-size:16px;line-height:1.35;clear:both}
.bubble.me{float:right;background:#0a84ff}
.bubble.ai{float:left;background:rgba(255,255,255,.2)}

/* Bühne */
#widgets{position:absolute;left:0;top:0;width:1024px;height:330px}
.wg{position:absolute;padding:14px 16px;overflow:visible}
.wb{height:100%;overflow:hidden}
.wdel{display:none;position:absolute;left:-8px;top:-8px;width:28px;height:28px;border-radius:14px;background:rgba(40,40,44,.95);border:2px solid #fff;text-align:center;line-height:24px;z-index:6}
.clkbox{float:left;width:90px;height:90px;margin-right:14px}
.clkbox svg{width:90px;height:90px}
.clktxt{padding-top:6px}
.lbl{font-size:17px;font-weight:600}
.lbl small{display:block;font-size:13px;color:rgba(255,255,255,.7);font-weight:500;margin-top:2px}
body.light .lbl small{color:rgba(0,0,0,.55)}
#status{position:absolute;left:0;top:0;width:1024px;height:36px;padding:0 44px;font-size:18px;font-weight:600;line-height:36px;z-index:5}
#status .r{float:right;font-size:15px;cursor:pointer}
#apps{position:absolute;left:0;top:330px;width:1024px;height:368px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px 32px 120px 32px}
.ap{display:inline-block;width:160px;height:118px;text-align:center;vertical-align:top;position:relative;cursor:pointer}
.ap .ic{margin:0 auto;box-shadow:0 8px 18px rgba(0,0,0,.28)}
.ap .nm{font-size:14px;margin-top:6px;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden}
.ap:active .ic{opacity:.7}
.rm{display:none;position:absolute;left:58px;top:-6px;width:28px;height:28px;border-radius:14px;background:rgba(40,40,44,.95);border:2px solid #fff;text-align:center;line-height:24px;z-index:5}
.edit .rm,.edit .wdel{display:block}
.edit .ap .ic,.edit .wg{-webkit-animation:wig .3s ease-in-out infinite alternate;animation:wig .3s ease-in-out infinite alternate}
@-webkit-keyframes wig{from{-webkit-transform:rotate(-1.5deg)}to{-webkit-transform:rotate(1.5deg)}}
@keyframes wig{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
#dock{position:absolute;left:50%;bottom:10px;margin-left:-190px;width:380px;height:84px;padding:11px;text-align:center;z-index:20}
.dki{display:inline-block;margin:0 9px;vertical-align:top;cursor:pointer}
.dki:active{opacity:.7}
#editbar{position:absolute;left:50%;top:44px;margin-left:-200px;width:400px;padding:8px;text-align:center;display:none;z-index:45}
.edit #editbar{display:block}
body.locked #status,body.locked #widgets,body.locked #apps,body.locked #dock{display:none}
body.setup #status,body.setup #widgets,body.setup #apps,body.setup #dock,body.setup #lock{display:none}

/* Sperren */
#lock{position:absolute;left:0;top:0;width:1024px;height:768px;text-align:center;padding-top:110px;z-index:60;-webkit-transition:-webkit-transform .5s ease-in,opacity .4s;transition:transform .5s ease-in,opacity .4s}
#lock.gone{-webkit-transform:translateY(-768px);transform:translateY(-768px);opacity:0}
#lock.hide{display:none}
#lt{font-size:170px;font-weight:300;letter-spacing:-5px;line-height:1;text-shadow:0 2px 20px rgba(0,0,0,.25)}
#ld{font-size:24px;font-weight:500;margin-top:8px;text-shadow:0 1px 8px rgba(0,0,0,.25)}
#lh{position:absolute;left:0;bottom:44px;width:100%;font-size:15px;opacity:.85}

/* Kontrollzentrum */
#cc{position:absolute;left:0;top:0;width:1024px;height:768px;z-index:70;background:rgba(0,0,0,.2);opacity:0;visibility:hidden;-webkit-transition:all .3s;transition:all .3s}
#cc.open{opacity:1;visibility:visible}
#ccp{position:absolute;right:14px;top:14px;width:430px;padding:16px;border-radius:32px;-webkit-transform:translateY(-120%);transform:translateY(-120%);-webkit-transition:all .4s ease-out;transition:all .4s ease-out}
#cc.open #ccp{-webkit-transform:none;transform:none}
.cct{display:inline-block;width:46%;margin:0 2% 10px 0;padding:16px 10px;border-radius:22px;background:rgba(255,255,255,.2);font-size:16px;font-weight:600;text-align:center;cursor:pointer;vertical-align:top}
.ccs{padding:12px 16px;margin-bottom:10px;border-radius:22px;background:rgba(255,255,255,.2);font-size:15px;font-weight:600}
.ccs input{width:100%;margin-top:6px;padding:0;border:0;background:none}

/* App-Fenster */
#sheet{position:absolute;left:14px;top:14px;width:996px;height:740px;z-index:40;border-radius:36px;opacity:0;visibility:hidden;-webkit-transform:scale(.92);transform:scale(.92);-webkit-transition:all .35s ease-out;transition:all .35s ease-out;overflow:hidden}
#sheet.open{opacity:1;visibility:visible;-webkit-transform:scale(1);transform:scale(1)}
#stt{display:block;font-size:24px;font-weight:700;padding:16px 80px 6px 24px}
#sheet .x{position:absolute;right:16px;top:14px;width:42px;height:42px;border-radius:21px;background:rgba(255,255,255,.25);text-align:center;line-height:42px;font-size:18px;cursor:pointer}
#sbody{position:absolute;left:0;top:62px;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 24px 40px}
#sbody.frame{overflow:hidden;padding:0}
#sbody iframe{width:100%;height:100%;border:0;background:#fff}

/* Einrichtung */
#setup{position:absolute;left:0;top:0;width:1024px;height:768px;z-index:90;display:none;text-align:center;padding-top:60px}
body.setup #setup{display:block}
#suc{display:inline-block;width:560px;padding:30px 34px;border-radius:36px;text-align:center}
#suc h1{font-size:30px;font-weight:700;margin-bottom:8px}
#suc p{font-size:16px;color:rgba(255,255,255,.75);margin:8px 0}
body.light #suc p{color:rgba(0,0,0,.6)}

#toast{position:absolute;left:50%;top:-80px;width:440px;margin-left:-220px;padding:12px;border-radius:99px;text-align:center;font-size:16px;font-weight:600;z-index:95;background:rgba(30,30,36,.92);-webkit-transition:all .35s;transition:all .35s}
#toast.show{top:18px}
</style>
</head>

<script>
/* ================= Helfer ================= */

function $(id){return document.getElementById(id);}
function pad(n){return (n<10?'0':'')+n;}
function trim(s){return String(s==null?'':s).replace(/^\s+|\s+$/g,'');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function uid(){return 'i'+(new Date().getTime()).toString(36)+Math.floor(Math.random()*100000).toString(36);}
function nf(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function dayKey(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
var DAYS=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
var MONS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function fmtT(d){return pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtD(d){return DAYS[d.getDay()]+', '+d.getDate()+'. '+MONS[d.getMonth()];}
function fmtMs(ms){var s=Math.max(0,Math.floor(ms/1000));return pad(Math.floor(s/60))+':'+pad(s%60);}
function A(e,n){return e.getAttribute('data-'+n);}
function up(el,pred){while(el&&el.nodeType===1){if(pred(el))return el;el=el.parentNode;}return null;}
function hasCls(el,c){return !!(el&&typeof el.className==='string'&&(' '+el.className+' ').indexOf(' '+c+' ')>-1);}
function upCls(el,c){return up(el,function(n){return hasCls(n,c);});}
function upAttr(el,a){return up(el,function(n){return !!(n.getAttribute&&n.getAttribute(a)!==null);});}
function upId(el,id){return up(el,function(n){return n.id===id;});}
function toast(m){var t=$('toast');t.innerHTML=esc(m);t.className='show';clearTimeout(toast.h);toast.h=setTimeout(function(){t.className='';},2200);}

/* ================= Daten ================= */
var KEY='agenIpad7';
var DEF={setup:false,name:'',wp:0,photo:'',accent:'#0a84ff',light:false,vol:70,bright:100,
 heat:3,rooms:[{n:'Wohnzimmer',on:true,b:80},{n:'Küche',on:false,b:60},{n:'Schlafzimmer',on:false,b:40}],
 apps:['clock','weather','calendar','reminders','notes','calc','photos','music','lights','heating','intercom','health','shop','agen','store','settings'],
 dock:['intercom','music','notes','settings'],
 widgets:[{id:'w1',t:'therm',x:0,y:0,w:2,h:2},{id:'w2',t:'clock',x:2,y:0,w:2,h:1},{id:'w3',t:'weather',x:4,y:0,w:2,h:1},{id:'w4',t:'intercom',x:2,y:1,w:2,h:1},{id:'w5',t:'steps',x:4,y:1,w:2,h:1}],
 custom:{},cc:{wifi:true,bt:true,focus:false,plane:false},
 note:'',todos:[],shop:[],events:[],alarms:[],steps:{},ilog:[],chat:[]};
function loadS(){
 var out=JSON.parse(JSON.stringify(DEF));
 try{var sv=JSON.parse(localStorage.getItem(KEY)||'{}');for(var k in sv){if(sv.hasOwnProperty(k))out[k]=sv[k];}}catch(e){}
 return out;
}
var S=loadS();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Speicher voll. Kleineres Foto nehmen.');}}
function getApp(id){
 var APPS=APPDEF();
 return APPS[id]||S.custom[id]||null;
}

var WID={
 therm:{n:'Heizung',w:2,h:2,app:'heating',d:'Stufe 1 bis 5'},

var CATALOG=[
 {id:'cat-pomodoro',n:'Pomodoro',i:'P',c:['#ff375f','#bf2b5a'],desc:'25 Minuten konzentriert arbeiten',

function blobURL(html){
 try{return URL.createObjectURL(new Blob([html],{type:'text/html'}));}
 catch(e){return 'data:text/html;charset=utf-8,'+encodeURIComponent(html);}
}

function ic(n,s){
 s=s||24;
 var f=(n==='play'||n==='pause'||n==='prev'||n==='next')?'#fff':'none';
 return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="'+f+'" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle">'+(ICONS[n]||'')+'</svg>';
}
function iconBox(a,size,rad){
 var inner=(a.i&&ICONS[a.i])?ic(a.i,Math.round(size*0.5)):'<span style="font-size:'+Math.round(size*0.45)+'px;font-weight:700">'+esc(a.i||a.n.charAt(0))+'</span>';
 return '<div class="ic" style="width:'+size+'px;height:'+size+'px;border-radius:'+rad+'px;display:table;background:-webkit-linear-gradient(top,'+a.c[0]+','+a.c[1]+')"><div style="display:table-cell;vertical-align:middle;text-align:center">'+inner+'</div></div>';
}
function clockSVG(){
 var s='<svg viewBox="-50 -50 100 100">';
 for(var i=0;i<12;i++) s+='<line y1="-44" y2="'+(i%3?-40:-38)+'" transform="rotate('+(i*30)+')" stroke="#fff" stroke-width="'+(i%3?1.2:2.6)+'" stroke-linecap="round"/>';
 s+='<line class="hh" y1="4" y2="-22" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>';
 s+='<line class="mh" y1="6" y2="-34" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>';
 s+='<line class="sh" y1="10" y2="-40" stroke="#ff453a" stroke-width="1"/><circle r="2.4" fill="#fff"/></svg>';
 return s;
}

/* ================= Anzeige ================= */
function fit(){
 var iw=window.innerWidth, ih=window.innerHeight;
 PORTRAIT=ih>iw;
 SCALE=Math.min(iw/W,ih/H);
 var st=$('stage');
 st.style.left=Math.round((iw-W*SCALE)/2)+'px';
 st.style.top=Math.round((ih-H*SCALE)/2)+'px';
 st.style.webkitTransform='scale('+SCALE+')';
 st.style.transform='scale('+SCALE+')';
 setBody();
}
function setBody(){
 var c=[];
 if(S.light) c.push('light');
 if(EDIT) c.push('edit');
 if(LOCKED&&S.setup&&!SETUP) c.push('locked');
 if(SETUP) c.push('setup');
 if(PORTRAIT) c.push('portrait');
 document.body.className=c.join(' ');
}
function applyTheme(){
 var img=$('wimg'), w=$('wall');
 if(S.photo){img.src=S.photo;img.style.display='block';w.className='';}
 else{img.style.display='none';img.removeAttribute('src');w.className='wp'+S.wp;}
 $('accst').innerHTML='.acc{background:'+S.accent+' !important}.lvl.on,.chk.on,.bar i{background:'+S.accent+'}.cbtn.op,.bubble.me,.cct.on{background:'+S.accent+'}';
 $('dim').style.opacity=((100-S.bright)/100*0.6).toFixed(2);
 setBody();
}
function renderWidgets(){
 var h='';
 for(var i=0;i<S.widgets.length;i++) h+=wgHTML(S.widgets[i]);
 if(!S.widgets.length) h='<div class="note" style="position:absolute;left:40px;top:120px">Keine Widgets. Im Bearbeitungsmodus über „+ Widget“ hinzufügen.</div>';
 $('widgets').innerHTML=h;
}
function wgHTML(w){
 if(!WID[w.t]) return '';
 return '<div class="gl wg" data-wid="'+w.id+'" style="left:'+(X0+w.x*CW+M)+'px;top:'+(Y0+w.y*RH+M)+'px;width:'+(w.w*CW-2*M)+'px;height:'+(w.h*RH-2*M)+'px">'+
  '<div class="wdel" data-act="wdel" data-id="'+w.id+'">'+ic('minus',14)+'</div>'+
  '<div class="wb">'+wbody(w)+'</div></div>';
}
function wbody(w){
 var t=w.t;
 if(t==='therm'){
  var lv='';for(var i=1;i<=5;i++) lv+='<span class="lvl'+(i<=S.heat?' on':'')+'" data-act="heat" data-v="'+i+'"></span>';
  return '<div class="lbl">Heizung<small>'+esc(S.rooms[0].n)+'</small></div><div class="big2">'+S.heat+'</div><div class="lvls">'+lv+'</div>';
 }
 if(t==='clock'){
  var d=new Date();
  return '<div class="clkbox">'+clockSVG()+'</div><div class="clktxt"><div class="dig big3">'+fmtT(d)+'</div><div class="small2">'+fmtD(d)+'</div></div>';
 }
 if(t==='weather') return '<div class="lbl">Wetter<small>Wildeshausen</small></div><div class="big3">14°</div><div class="small2">Bewölkt</div>';
 if(t==='intercom') return '<div class="lbl">Ansage<small>Im ganzen Haus</small></div><div class="ctr">'+ic('wave',44)+'</div>';
 if(t==='steps'){
  var st=S.steps[dayKey()]||0;
  return '<div class="lbl">Schritte<small>Heute</small></div><div class="big3">'+nf(st)+'</div><div class="bar"><i style="width:'+Math.min(100,st/100)+'%"></i></div>';
 }
 if(t==='music'){
  var cur=MUS.list[MUS.i], pl=!!(MUS.a.src&&!MUS.a.paused);
  return '<div class="lbl">Musik<small>'+esc(cur?cur.name:'Nichts gewählt')+'</small></div>'+
   '<div class="ctr"><span class="ibtn" data-act="mPrev">'+ic('prev',28)+'</span><span class="ibtn" data-act="mToggle">'+ic(pl?'pause':'play',34)+'</span><span class="ibtn" data-act="mNext">'+ic('next',28)+'</span></div>';
 }
 if(t==='todo'){
  var op=S.todos.filter(function(x){return !x.done;}), oh='';
  for(var j=0;j<op.length&&j<4;j++) oh+='<div class="wline">○ '+esc(op[j].t)+'</div>';
  return '<div class="lbl">Erinnerungen<small>'+op.length+' offen</small></div>'+oh;
 }
 if(t==='calendar'){
  var ev=sortEvents().slice(0,3), eh='';
  for(var k=0;k<ev.length;k++) eh+='<div class="wline"><b>'+esc(ev[k].n)+'</b> '+esc(ev[k].t)+'</div>';
  return '<div class="lbl">Kalender<small>Nächste Termine</small></div>'+(eh||'<div class="wline">Keine Termine</div>');
 }
 return '';
}
function sortEvents(){
 return S.events.slice().sort(function(a,b){var x=a.d+a.t,y=b.d+b.t;return x<y?-1:(x>y?1:0);});
}

function renderDock(){

  h+='<div class="dki" data-app="'+esc(S.dock[i])+'">'+iconBox(a,62,18)+'</div>';

 $('lock').className='gone';
 setTimeout(function(){$('lock').className='hide';},520);

}

/* ================= Bearbeitungsmodus ================= */
function enterEdit(){
 if(EDIT||LOCKED||SETUP) return;
 EDIT=true; setBody();
 if(navigator.vibrate) navigator.vibrate(15);
}
function exitEdit(){
 if(!EDIT) return;
 EDIT=false; setBody();
}
function findW(id){
 for(var i=0;i<S.widgets.length;i++) if(S.widgets[i].id===id) return S.widgets[i];
 return null;
}
function collides(id,x,y,w,h){
 for(var i=0;i<S.widgets.length;i++){
  var o=S.widgets[i];
  if(o.id===id) continue;
  if(x<o.x+o.w&&x+w>o.x&&y<o.y+o.h&&y+h>o.y) return true;
 }
 return false;
}
function addWidget(t){
 var d=WID[t]; if(!d) return;
 for(var y=0;y<=ROWS-d.h;y++){
  for(var x=0;x<=COLS-d.w;x++){
   if(!collides('',x,y,d.w,d.h)){
    S.widgets.push({id:uid(),t:t,x:x,y:y,w:d.w,h:d.h});
    save(); closeApp(); refresh(); toast(d.n+' hinzugefügt');
    return;
   }
  }
 }
 toast('Kein Platz. Erst ein Widget entfernen.');
}
function openWidgetPicker(){
 if(LOCKED||SETUP) return;
 var h='';
 for(var k in WID){
  if(!WID.hasOwnProperty(k)) continue;
  var on=false; for(var i=0;i<S.widgets.length;i++) if(S.widgets[i].t===k) on=true;
  if(!on) h+='<div class="row" data-act="pickW" data-t="'+k+'"><b>'+WID[k].n+'</b><small>'+WID[k].d+'</small></div>';
 }
 CUR=null;
 $('stt').innerHTML='Widget hinzufügen';
 $('sbody').className='';
 $('sbody').innerHTML=h||'<p class="note">Alle Widgets sind schon auf dem Home-Bildschirm.</p>';
 $('sheet').className='open';
}

/* ================= App-Fenster ================= */
function openApp(id){
 if(EDIT||LOCKED||SETUP) return;
 var a=getApp(id); if(!a) return;
 closeCC();
 CUR=id;
 renderSheet(true);
 $('sheet').className='open';
}
function closeApp(){
 CUR=null;
 $('sheet').className='';
 setTimeout(function(){ if(!CUR){ $('sbody').innerHTML=''; $('sbody').className=''; } },380);
}
function renderSheet(fresh){
 if(!CUR) return;
 var a=getApp(CUR); if(!a) return;
 $('stt').innerHTML=esc(a.n);
 var b=$('sbody');
 if(a.html){
  if(fresh||!b.firstChild){
   b.className='frame'; b.innerHTML='';
   var f=document.createElement('iframe');
   f.src=blobURL(a.html);
   b.appendChild(f);
  }
  return;
 }
 b.className='';
 var v=VIEWS[CUR];
 b.innerHTML=v?v():'<p class="note">Kommt bald.</p>';
}

function calcKey(k){
 if(k==='C') CALC='';
 else if(k==='='){
  try{
   var x=CALC.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');
   if(!/^[0-9+\-*\/(). ]*$/.test(x)) throw new Error('bad');
   var r=Function('return ('+x+');')();
   CALC=isFinite(r)?String(+r.toFixed(10)):'Fehler';
  }catch(e){CALC='Fehler';}
 } else {
  if(CALC==='Fehler') CALC='';
  CALC+=k;
 }
}

function loadVoice(){
 try{
  var vs=speechSynthesis.getVoices()||[];
  for(var i=0;i<vs.length;i++){ if(vs[i].lang&&vs[i].lang.indexOf('de')===0){VOICE=vs[i];break;} }
 }catch(e){}
}
function say(t){
 if(!('speechSynthesis' in window)||!window.SpeechSynthesisUtterance){toast('Ansage wird hier nicht unterstützt');return;}
 try{
  loadVoice();
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(t);
  u.lang='de-DE'; if(VOICE) u.voice=VOICE;
  u.rate=0.9;
  speechSynthesis.speak(u);
 }catch(e){toast('Ansage fehlgeschlagen');}
}
function beep(){
 try{
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  var c=new AC(), o=c.createOscillator(), g=c.createGain();
  o.frequency.value=880; o.connect(g); g.connect(c.destination);
  o.start(0); o.stop(c.currentTime+0.4);
 }catch(e){}
}
function readAsImg(file,max,cb){
 var r=new FileReader();
 r.onload=function(){
  var img=new Image();
  img.onload=function(){
   var s=Math.min(1,max/Math.max(img.width,img.height));
   var c=document.createElement('canvas');
   c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s));
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   cb(c.toDataURL('image/jpeg',0.8));
  };
  img.src=r.result;
 };
 r.readAsDataURL(file);
}
function readText(file,cb){
 var r=new FileReader();
 r.onload=function(){cb(r.result);};
 r.readAsText(file);
}

function tick(){

 $('ld').innerHTML=fmtD(d);
 var dig=document.getElementsByClassName('dig');
 for(var i=0;i<dig.length;i++) dig[i].innerHTML=fmtT(d);
 var hh=document.getElementsByClassName('hh'), mh=document.getElementsByClassName('mh'), sh=document.getElementsByClassName('sh');
 for(i=0;i<hh.length;i++) hh[i].setAttribute('transform','rotate('+((h%12)*30+m*0.5)+')');
 for(i=0;i<mh.length;i++) mh[i].setAttribute('transform','rotate('+(m*6+s*0.1)+')');
 for(i=0;i<sh.length;i++) sh[i].setAttribute('transform','rotate('+(s*6)+')');
 var tmv=$('tmv'); if(tmv) tmv.innerHTML=fmtMs(tmLeft());
 if(TM.end&&Date.now()>=TM.end){
  TM={rem:TMDUR,end:0};
  beep(); toast('Timer abgelaufen'); say('Timer abgelaufen');
  if(CUR==='clock') renderSheet(false);
 }
 var key=pad(h)+':'+pad(m);
 if(s===0&&LASTK!==key){
  LASTK=key;
  for(var a=0;a<S.alarms.length;a++){
   if(S.alarms[a].on&&S.alarms[a].t===key){
    beep(); toast('Wecker: '+(S.alarms[a].l||S.alarms[a].t));
    say('Wecker. '+(S.alarms[a].l||''));
   }
  }
 }
}

/* ================= Eingaben ================= */
document.addEventListener('input',function(e){
 var t=e.target, k=t.getAttribute&&t.getAttribute('data-in'); if(!k) return;
 var v=t.value;
 if(k==='bright'){S.bright=+v;applyTheme();save();}
 else if(k==='vol'){S.vol=+v;MUS.a.volume=S.vol/100;save();}
 else if(k==='room'){var r=S.rooms[+A(t,'i')];if(r){r.b=+v;save();}}
 else if(k==='note'){S.note=v;save();}
 else if(k==='suname'){SU.name=v;}
},false);
document.addEventListener('change',function(e){
 var t=e.target;
 var k=t.getAttribute&&t.getAttribute('data-in');
 if(k==='name'){S.name=trim(t.value)||S.name;save();refresh();return;}
 var f=t.getAttribute&&t.getAttribute('data-file');
 if(f){
  var files=t.files;
  if(files&&files.length){
   if(f==='photo') readAsImg(files[0],1280,function(d){S.photo=d;save();applyTheme();refresh();toast('Hintergrund gesetzt');});
   else if(f==='music'){for(var i=0;i<files.length;i++) MUS.list.push({name:files[i].name,url:URL.createObjectURL(files[i])});refresh();}
   else if(f==='install') readText(files[0],addCustomFromJSON);
  }
  try{t.value='';}catch(err){}
 }
},false);
document.addEventListener('keydown',function(e){
 var t=e.target;
 if(e.key==='Enter'&&t.getAttribute&&t.getAttribute('data-enter')){
  var fn=t.getAttribute('data-enter');
  if(ACT[fn]) ACT[fn](t);
  return;
 }
 if(e.key==='Escape'){closeApp();closeCC();exitEdit();}
},false);

/* ================= Tippen ================= */
function onClick(e){
 if(Date.now()<SUPUNTIL) return;
 var t=e.target;
 if(SETUP){ var sa=upAttr(t,'data-act'); if(sa) runAct(sa); return; }
 if(LOCKED){
  var la=upAttr(t,'data-act');
  if(la){runAct(la);return;}
  if(S.setup) unlock();
  return;
 }
 var a=upAttr(t,'data-act');
 if(a){runAct(a);return;}
 if(CC){ if(!upId(t,'ccp')) closeCC(); return; }
 var ap=upAttr(t,'data-app');
 if(ap){ if(!EDIT) openApp(ap.getAttribute('data-app')); return; }
 var wg=upCls(t,'wg');
 if(wg){
  if(!EDIT){ var wd=findW(wg.getAttribute('data-wid')); if(wd&&WID[wd.t]) openApp(WID[wd.t].app); }
  return;
 }
 if(EDIT&&!upId(t,'editbar')) exitEdit();
}
document.addEventListener('click',onClick,false);

/* ================= Halten, Ziehen, Wischen ================= */
function pt(e){
 var t=(e.changedTouches&&e.changedTouches.length)?e.changedTouches[0]:((e.touches&&e.touches.length)?e.touches[0]:e);
 return {x:t.clientX,y:t.clientY};
}
function mkDrag(wg){
 return {el:wg,id:wg.getAttribute('data-wid'),ol:parseFloat(wg.style.left)||0,ot:parseFloat(wg.style.top)||0,mx:0,my:0,moved:false};
}
function onDown(e){
 var p=pt(e);
 START={x:p.x,y:p.y};
 PRESS=null; DRAG=null;
 if(SETUP||LOCKED||CC) return;
 var t=e.target;
 if(upId(t,'editbar')||upAttr(t,'data-act')||upId(t,'sheet')) return;
 var wg=upCls(t,'wg'), ap=upAttr(t,'data-app');
 if(EDIT){
  if(wg) DRAG=mkDrag(wg);
  return;
 }
 if(wg||ap){
  PRESS={el:wg,t:setTimeout(function(){
   PRESS=null;
   SUPUNTIL=Date.now()+500;
   enterEdit();
   if(wg&&wg.parentNode) DRAG=mkDrag(wg);
  },500)};
 }
}
function onMove(e){
 var p=pt(e);
 if(PRESS&&(Math.abs(p.x-START.x)+Math.abs(p.y-START.y))>10){clearTimeout(PRESS.t);PRESS=null;}
 if(!DRAG) return;
 var dx=(p.x-START.x)/SCALE, dy=(p.y-START.y)/SCALE;
 if(!DRAG.moved&&Math.abs(dx)+Math.abs(dy)<4) return;
 DRAG.moved=true; DRAG.mx=dx; DRAG.my=dy;
 DRAG.el.style.left=(DRAG.ol+dx)+'px';
 DRAG.el.style.top=(DRAG.ot+dy)+'px';
 DRAG.el.style.zIndex='20';
 if(e.cancelable) e.preventDefault();
}
function finishDrag(D){
 var w=findW(D.id);
 if(!w){renderWidgets();return;}
 var nx=clamp(Math.round((D.ol+D.mx-X0-M)/CW),0,COLS-w.w);
 var ny=clamp(Math.round((D.ot+D.my-Y0-M)/RH),0,ROWS-w.h);
 if(!collides(D.id,nx,ny,w.w,w.h)){w.x=nx;w.y=ny;}
 save(); renderWidgets();
}
function onUp(e){
 var p=pt(e), dx=p.x-START.x, dy=p.y-START.y;
 if(PRESS){clearTimeout(PRESS.t);PRESS=null;}
 if(SETUP) return;
 if(LOCKED){
  if(S.setup&&dy<-60&&Math.abs(dy)>Math.abs(dx)) unlock();
  return;
 }
 if(DRAG){
  var D=DRAG; DRAG=null;
  if(D.moved){ finishDrag(D); SUPUNTIL=Date.now()+350; }
  return;
 }
 if(!EDIT&&!CC&&START.y<50&&dy>50&&START.x>W/2) openCC();
}
if(TOUCH){
 document.addEventListener('touchstart',onDown,false);
 document.addEventListener('touchmove',onMove,false);
 document.addEventListener('touchend',onUp,false);
} else {
 document.addEventListener('mousedown',onDown,false);
 document.addEventListener('mousemove',onMove,false);
 document.addEventListener('mouseup',onUp,false);
}

/* ================= Start ================= */
fit();
window.addEventListener('resize',fit,false);
window.addEventListener('orientationchange',function(){setTimeout(fit,300);},false);
MUS.a.volume=S.vol/100;
if(window.speechSynthesis){
 try{speechSynthesis.onvoiceschanged=loadVoice;loadVoice();}catch(e){}
}
applyTheme();
if(!S.setup){
 SETUP=true;
 SU={name:'',wp:0,accent:'#0a84ff',light:false};
 $('setup').style.display='';
 renderSetup();
 setBody();
} else {
 showLock();
 renderAll();
}
tick();
setInterval(tick,1000);
</script>
</body>
</html>
