<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agen Home Hub</title>
<style>
:root{--accent:#0a84ff;--blur:34px;--is:1;--cw:200px;--cols:6;--txt:#fff;--dim:rgba(255,255,255,.72);
 --font:"Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--ease:cubic-bezier(.2,.9,.25,1.08)}
body.light{--txt:#111;--dim:rgba(0,0,0,.55)}
body.noanim *{animation:none!important;transition-duration:0s!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:var(--font);color:var(--txt);user-select:none;-webkit-user-select:none}
input,textarea,select{user-select:text;-webkit-user-select:text;color:var(--txt);font:inherit;background:none}
textarea{resize:none}
svg{display:block;flex:none}
.hide{display:none!important}

#stage{position:fixed;left:50%;top:50%;overflow:hidden;background:#000}
#wall{position:absolute;inset:0;background-size:cover;background-position:center;transition:background .6s}
.wp0{background:radial-gradient(120% 80% at 75% 0%,#f0b68a,transparent 60%),radial-gradient(90% 70% at 0% 100%,#c97b55,transparent 70%),linear-gradient(#b5764f,#6e4130)}
.wp1{background:radial-gradient(110% 70% at 80% 0%,#4f8bff,transparent 55%),radial-gradient(100% 80% at 10% 100%,#1b2262,transparent 70%),linear-gradient(#1c2352,#070916)}
.wp2{background:radial-gradient(100% 70% at 20% 0%,#ff9d74,transparent 55%),radial-gradient(90% 80% at 100% 100%,#b24d86,transparent 60%),linear-gradient(#2b1a33,#120a16)}
.wp3{background:radial-gradient(100% 70% at 50% 0%,#f4f6fb,transparent 60%),linear-gradient(#cfd8e8,#8e9bb6)}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:999}

.glass{position:relative;overflow:hidden;border-radius:var(--r,28px);
 background:linear-gradient(160deg,rgba(255,255,255,.30),rgba(255,255,255,.07));
 -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%);
 box-shadow:0 14px 40px rgba(0,0,0,.22),inset 0 0 0 1px rgba(255,255,255,.2),inset 0 1.5px 0 rgba(255,255,255,.55)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.16) 47%,transparent 60%)}
body.light .glass{background:linear-gradient(160deg,rgba(255,255,255,.8),rgba(255,255,255,.5))}

.pill{border:0;border-radius:999px;color:#fff;font:inherit;font-weight:600;font-size:17px;padding:13px 22px;cursor:pointer;
 background:linear-gradient(160deg,rgba(255,255,255,.38),rgba(255,255,255,.1));
 -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 16px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.pill:active{transform:scale(.93)}
.pill:disabled{opacity:.5}
.pill.blue{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000))}
.ibtn{border:0;background:none;color:var(--txt);cursor:pointer;padding:6px;border-radius:50%;transition:transform .2s var(--ease)}
.ibtn:active{transform:scale(.85)}
.round{width:50px;height:50px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:var(--txt);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s var(--ease)}
.round:active{transform:scale(.85)}
.switch{width:52px;height:32px;border-radius:99px;background:rgba(120,120,128,.55);position:relative;flex:none;cursor:pointer;transition:background .3s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .35s var(--ease)}
.switch.on{background:#34c759}.switch.on::after{transform:translateX(20px)}
.field{width:100%;padding:14px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);font-size:17px;outline:none}
body.light .field{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.12)}
.field::placeholder{color:var(--dim)}
.addrow{display:flex;gap:10px;margin-bottom:14px;align-items:stretch}
.addrow>.field{flex:1;min-width:0}
.seg{display:flex;gap:4px;padding:4px;margin-bottom:14px;border-radius:16px;background:rgba(255,255,255,.14)}
.seg button{flex:1;border:0;background:transparent;color:var(--txt);padding:11px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:rgba(255,255,255,.34)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;border:0;padding:12px;border-radius:14px;background:rgba(255,255,255,.12);color:var(--txt);font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:rgba(255,255,255,.34)}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 18px;border-radius:20px;margin-bottom:10px;background:rgba(255,255,255,.12);font-size:17px}
.row small{display:block;color:var(--dim);font-size:13px;margin-top:3px}
.row input[type=range]{width:200px;accent-color:var(--accent)}
.rcard{padding:16px 18px;margin-bottom:12px;--r:24px}
.rcard input[type=range]{width:100%;margin-top:12px;accent-color:var(--accent)}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.note{color:var(--dim);font-size:14px;margin:12px 4px;line-height:1.45}
.sec{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin:20px 4px 8px}
.big{font-size:110px;font-weight:200;text-align:center;letter-spacing:-3px;font-variant-numeric:tabular-nums;margin:12px 0 4px}
.ctrl{display:flex;justify-content:center;gap:24px;align-items:center;margin-top:12px}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .6s var(--ease)}
.bar5{display:flex;gap:10px;align-items:center}
.bar5 i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .3s}
.bar5 i.on{background:var(--accent)}
.sw{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.4);display:inline-block}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.chk.on{background:var(--accent);border-color:var(--accent)}
.wp-row{display:flex;gap:14px}
.wp-pick{width:62px;height:62px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.wp-pick.sel{border-color:#fff}
.wpthumb{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.wpthumb.sel{border-color:#fff}
.dots{display:flex;gap:7px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .3s var(--ease)}
.dots i.on{background:#fff;width:22px;border-radius:5px}
.checks{width:100%;display:flex;flex-direction:column;gap:8px}
.checks .row{margin:0;cursor:pointer}
.art{margin:10px auto 20px;width:180px;height:180px;border-radius:44px;background:linear-gradient(160deg,#ff375f,#bf2b5a);display:flex;align-items:center;justify-content:center}
.chatbox{min-height:340px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.bubble{padding:12px 16px;border-radius:20px;max-width:78%;font-size:16px;line-height:1.4;animation:pop .35s var(--ease) both}
.bubble.me{align-self:flex-end;background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000))}
.bubble.ai{align-self:flex-start;background:rgba(255,255,255,.18)}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cbtn{height:72px;border:0;border-radius:22px;font:inherit;font-size:26px;color:#fff;background:rgba(255,255,255,.2);cursor:pointer}
.cbtn.op{background:var(--accent)}
.cbtn:active{transform:scale(.92)}

@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1)}}
@keyframes rise{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes wig{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@keyframes breathe{0%,100%{opacity:.6;transform:scaleX(.8)}50%{opacity:1;transform:scaleX(1.1)}}
.row,.rcard,.sa{animation:rise .35s var(--ease) both}
.enter .app,.enter .w{animation:pop .5s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
body.edit .app .ic{animation:wig .28s ease-in-out infinite alternate;animation-delay:calc(var(--i,0)*-30ms)}
body.edit .w .wbody{animation:wig .28s ease-in-out infinite alternate;animation-delay:calc(var(--i,0)*-30ms)}

.app{width:var(--cw);display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;position:relative}
.app .ic{width:calc(96px*var(--is));height:calc(96px*var(--is));border-radius:calc(24px*var(--is));display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.12),0 8px 18px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.app .ic svg{width:calc(50px*var(--is));height:calc(50px*var(--is))}
.app:active .ic{transform:scale(.88)}
.app .nm{font-size:15px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.app .xb{position:absolute;top:-4px;left:calc(50% - 60px);width:30px;height:30px;border-radius:50%;background:rgba(40,40,44,.92);border:2px solid #fff;display:none;align-items:center;justify-content:center;z-index:3}
body.edit .app{touch-action:none}
body.edit .app .xb{display:flex}

#status{position:absolute;top:12px;left:48px;right:48px;height:30px;display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:600;z-index:5;font-variant-numeric:tabular-nums}
#pages{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;z-index:4}
#pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;height:100%;position:relative;scroll-snap-align:start;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(var(--cols),var(--cw));justify-content:center;row-gap:26px;padding:84px 0 200px;align-content:start;height:100%}
#pdots{position:absolute;left:0;right:0;bottom:128px;display:flex;justify-content:center;gap:8px;z-index:5}
#pdots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);transition:all .35s var(--ease)}
#pdots i.on{background:#fff;width:22px;border-radius:5px}
#dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;padding:12px 18px;--r:40px;display:flex;gap:14px;animation:rise .5s var(--ease) both}
#dock .app{width:auto}
#dock .app .ic{width:calc(84px*var(--is));height:calc(84px*var(--is));border-radius:calc(22px*var(--is))}
#dock .nm,#dock .xb{display:none!important}
#editbar{position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:45;padding:10px;--r:99px;display:flex;gap:10px;animation:pop .4s var(--ease) both}

.w{position:absolute;--r:32px;padding:18px;display:flex;flex-direction:column;cursor:pointer;overflow:visible}
.w.lift{z-index:30;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.w .wbody{flex:1;min-height:0;height:100%;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.w .wdel{position:absolute;top:-8px;left:-8px;width:30px;height:30px;border-radius:50%;background:rgba(40,40,44,.92);border:2px solid #fff;display:none;align-items:center;justify-content:center;z-index:4}
.w .wres{position:absolute;right:4px;bottom:4px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.45);display:none;cursor:nwse-resize;z-index:4}
body.edit .w{touch-action:none}
body.edit .w .wdel,body.edit .w .wres{display:flex}
.lbl{font-size:17px;font-weight:600}
.lbl small{display:block;font-size:14px;color:var(--dim);font-weight:500;margin-top:3px}
.tnum{font-size:min(7vw,90px);font-weight:200;letter-spacing:-4px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.dig{font-size:min(6vw,64px);font-weight:300;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1}
.dtxt{font-size:17px;color:var(--dim);margin-top:6px}
.wxt{font-size:52px;font-weight:200;letter-spacing:-2px}
.scenerow{display:flex;gap:12px;height:100%}
.tile{--r:24px;flex:1;padding:14px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .25s var(--ease)}
.tile:active{transform:scale(.94)}
.tile.on{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000))}

#cc{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .3s}
#cc.open{opacity:1;pointer-events:auto}
#cc-panel{--r:34px;position:absolute;top:14px;right:14px;width:440px;padding:18px;display:flex;flex-direction:column;gap:12px;transform:translateY(-120%);transition:transform .45s var(--ease)}
#cc.open #cc-panel{transform:none}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc-tile{--r:24px;padding:16px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:17px;cursor:pointer}
.cc-tile.on{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000))}
.cc-sl{--r:24px;padding:14px 18px;display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600}
.cc-sl input{width:100%;accent-color:#fff}
.cc-mini{--r:24px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}

#sheet{position:absolute;inset:14px;z-index:40;border-radius:40px;display:flex;flex-direction:column;color:#fff;--txt:#fff;--dim:rgba(255,255,255,.72);
 background:rgba(18,22,38,.6);-webkit-backdrop-filter:blur(40px) saturate(170%);backdrop-filter:blur(40px) saturate(170%);
 box-shadow:0 20px 60px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.18);
 opacity:0;transform:scale(.9);pointer-events:none;transition:transform .45s var(--ease),opacity .3s}
#sheet.open{opacity:1;transform:none;pointer-events:auto}
.sheet-top{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid rgba(255,255,255,.18)}
.sheet-top h2{font-size:26px;font-weight:700}
.x{width:44px;height:44px;border-radius:50%;border:0;color:#fff;font-size:20px;cursor:pointer;background:rgba(255,255,255,.2)}
#sheet-body{flex:1;overflow-y:auto;padding:22px 26px 36px;display:flex;flex-direction:column;min-height:0}
#sheet-body.frame{padding:0;overflow:hidden}
#sheet-body iframe{flex:1;width:100%;border:0;border-radius:0 0 40px 40px;background:#111}
#sheet .field{color:#fff;background:rgba(255,255,255,.14)}
#sheet select option{color:#111}

#lock{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;padding-top:110px;transition:transform .55s var(--ease),opacity .4s}
#lock.gone{transform:translateY(-100%);opacity:0;pointer-events:none}
.lock-time{font-size:190px;font-weight:300;letter-spacing:-6px;line-height:.95;font-variant-numeric:tabular-nums;text-shadow:0 2px 24px rgba(0,0,0,.2)}
.lock-date{margin-top:10px;font-size:26px;font-weight:500;text-shadow:0 1px 10px rgba(0,0,0,.2)}
.lock-foot{position:absolute;bottom:50px;left:0;right:0;text-align:center;font-size:16px;color:rgba(255,255,255,.85)}
.lock-foot i{display:block;margin:0 auto 12px;width:46px;height:5px;border-radius:5px;background:rgba(255,255,255,.75);animation:breathe 2.4s ease-in-out infinite}

#setup{position:absolute;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:30px}
#setup-card{--r:36px;width:min(600px,100%);max-height:100%;overflow:auto;padding:34px 30px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;animation:rise .45s var(--ease) both}
#setup h1{font-size:30px;font-weight:700;letter-spacing:-.5px}
#setup p{color:var(--dim);font-size:17px;line-height:1.45}

#toast{position:absolute;left:50%;top:-80px;transform:translateX(-50%);z-index:95;padding:12px 24px;border-radius:99px;font-weight:600;font-size:17px;white-space:nowrap;transition:top .4s var(--ease)}
#toast.show{top:22px}
</style>
</head>
<body>
<div id="stage">
  <div id="wall" class="wp0"></div>

  <div id="status" class="hide"><span id="sb-time"></span><span><svg width="20" height="13" viewBox="0 0 20 13" fill="#fff"><rect x="0" y="9" width="3.4" height="4" rx="1"/><rect x="5" y="6" width="3.4" height="7" rx="1"/><rect x="10" y="3" width="3.4" height="10" rx="1"/><rect x="15" y="0" width="3.4" height="13" rx="1"/></svg></span></div>

  <div id="pages" class="hide"></div>
  <div id="pdots" class="hide"></div>
  <div id="dock" class="glass hide"></div>

  <div id="editbar" class="glass hide">
    <button class="pill" data-act="addWidget">+ Widget</button>
    <button class="pill" data-act="openStore">+ App</button>
    <button class="pill blue" data-act="doneEdit">Fertig</button>
  </div>

  <div id="lock" class="hide">
    <div class="lock-time" id="lk-time"></div>
    <div class="lock-date" id="lk-date"></div>
    <div class="lock-foot"><i></i>Nach oben wischen zum Öffnen</div>
  </div>

  <div id="cc"><div class="glass" id="cc-panel"></div></div>

  <div id="sheet">
    <div class="sheet-top"><h2 id="sheet-title"></h2><button class="x" data-act="closeApp" aria-label="schließen">✕</button></div>
    <div id="sheet-body"></div>
  </div>

  <div id="setup" class="hide"><div class="glass" id="setup-card"></div></div>
  <div id="toast" class="glass"></div>
  <div id="dim"></div>
</div>

<script>
/* ================= Grundlagen ================= */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const G=14, PADX=48, PADT=72;

let W=1280,H=800,SC=1,PORT=false,COLS=6,ROWS=3,CW=200,CH=156;
let EDIT=false, LOCKED=true, SETUPON=false, CUR=null, CALC='', CAM=null;
let DRAG=null, PRESS=null, START={x:0,y:0}, IGN=false;
let CLOCK_TAB='time', STORE_TAB='discover';
let LAST_MIN='';
let TMDUR=300000, TM={rem:300000,end:0};
let SW={acc:0,start:0,run:false};
let SU={step:0,name:'',wp:0,light:false,accent:'#0a84ff',anim:true,widgets:[],apps:[]};
const MUS={list:[],i:0,a:new Audio()};

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200);}
function speak(t){try{if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';speechSynthesis.speak(u);}}catch(e){}}

/* ================= Icons ================= */
const ICONS={
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
cloud:'<path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.5 3.5 0 0 0 7 18z"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="3.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
check:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12.5l3 3 5-6"/>',
note:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/>',
calc:'<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7.5h8M8 12h1M12 12h1M16 12h1M8 16h1M12 16h1M16 16h1"/>',
music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1V17h5v-1c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',

function fit(){
 PORT=innerHeight>innerWidth;
 W=PORT?800:1280; H=PORT?1280:800;
 COLS=PORT?4:6;
 CW=(W-PADX*2)/COLS;
 CH=Math.round(CW*0.8);
 ROWS=Math.max(2,Math.floor((H-PADT-200)/CH));
 SC=Math.min(innerWidth/W,innerHeight/H);
 const st=$('stage');
 st.style.width=W+'px'; st.style.height=H+'px';
 st.style.transform='translate(-50%,-50%) scale('+SC+')';
 const r=document.documentElement.style;
 r.setProperty('--cw',CW+'px');
 r.setProperty('--cols',COLS);
}
function layoutKey(){return PORT?'port':'land';}
function WIDGETS(){
 const k=layoutKey();
 if(!Array.isArray(S.widgets[k])) S.widgets[k]=defaultLayout(COLS,DEFAULT_TYPES);
 return S.widgets[k];
}
function findSlotIn(w,h,list,cols){
 for(let y=0;y<20;y++){
  for(let x=0;x+w<=cols;x++){
   if(!list.some(o=>x<o.x+o.w&&x+w>o.x&&y<o.y+o.h&&y+h>o.y)) return {x:x,y:y};
  }
 }
 return {x:0,y:20};
}
function defaultLayout(cols,types){
 const list=[];
 types.forEach(t=>{
  const d=WID[t]; if(!d) return;
  const w=Math.min(d.w,cols), h=d.h;
  const sl=findSlotIn(w,h,list,cols);
  list.push({id:uid(),t:t,x:sl.x,y:sl.y,w:w,h:h});
 });
 return list;
}
function collides(wd,x,y,w,h){
 return WIDGETS().some(o=>o.id!==wd.id&&x<o.x+o.w&&x+w>o.x&&y<o.y+o.h&&y+h>o.y);
}

/* ================= Uhr ================= */
function timeStr(d){return d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',hour12:!S.h24});}
function dateStr(d){return (d||new Date()).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});}
function fmtMs(ms){const s=Math.floor(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60);}
function tmLeft(){return TM.end?Math.max(0,TM.end-Date.now()):TM.rem;}
function swMs(){return SW.acc+(SW.run?Date.now()-SW.start:0);}
function clockSVG(){
 let s='<svg viewBox="-50 -50 100 100" style="width:100%;height:100%">';
 for(let i=0;i<12;i++) s+=`<line y1="-44" y2="${i%3?-40:-38}" transform="rotate(${i*30})" stroke="#fff" stroke-width="${i%3?1.2:2.6}" stroke-linecap="round"/>`;
 s+='<line class="hh" y1="4" y2="-22" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>';
 s+='<line class="mh" y1="6" y2="-34" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>';
 s+='<line class="sh" y1="10" y2="-40" stroke="#ff453a" stroke-width="1"/><circle r="2.4" fill="#fff"/></svg>';
 return s;
}
function tick(){
 const d=new Date(), h=d.getHours(), m=d.getMinutes(), s=d.getSeconds();
 $('sb-time').textContent=timeStr(d);
 $('lk-time').textContent=pad(h)+':'+pad(m);
 $('lk-date').textContent=dateStr(d);
 document.querySelectorAll('.hh').forEach(el=>el.setAttribute('transform','rotate('+((h%12)*30+m*0.5)+')'));
 document.querySelectorAll('.mh').forEach(el=>el.setAttribute('transform','rotate('+(m*6+s*0.1)+')'));
 document.querySelectorAll('.sh').forEach(el=>el.setAttribute('transform','rotate('+(s*6)+')'));
 document.querySelectorAll('[data-role=dig]').forEach(el=>el.textContent=timeStr(d));
 document.querySelectorAll('[data-role=ddate]').forEach(el=>el.textContent=dateStr(d));
 document.querySelectorAll('[data-role=tm]').forEach(el=>el.textContent=fmtMs(tmLeft()));
 document.querySelectorAll('[data-role=sw]').forEach(el=>el.textContent=fmtMs(swMs()));
 const key=pad(h)+':'+pad(m);
 if(s===0&&LAST_MIN!==key){
  LAST_MIN=key;
  S.alarms.forEach(a=>{if(a.on&&a.t===key){toast('Wecker: '+(a.l||a.t));speak(a.l||'Wecker');}});
 }
 if(TM.end&&Date.now()>=TM.end){
  TM={rem:TMDUR,end:0};
  toast('Timer abgelaufen'); speak('Timer abgelaufen');
  if(CUR==='clock') renderSheet();
 }
}

  case 'calendar': {

   const open=S.todos.filter(t=>!t.done);
   return `<div class="lbl">Erinnerungen<small>${open.length} offen</small></div>${open.slice(0,4).map(t=>`<div style="font-size:15px;margin-top:6px">○ ${esc(t.t)}</div>`).join('')}`;

const HOME_EL=['pages','pdots','dock','status'];
function showLock(){
 LOCKED=true; EDIT=false; document.body.classList.remove('edit');
 $('editbar').classList.add('hide');
 closeApp(); toggleCC(false);
 const l=$('lock'); l.classList.remove('gone','hide');
 HOME_EL.forEach(i=>$(i).classList.add('hide'));

}
function unlockNow(){
 if(!LOCKED) return;
 LOCKED=false;
 const l=$('lock'); l.classList.add('gone');
 setTimeout(()=>l.classList.add('hide'),560);

function enterEdit(){

 if(navigator.vibrate) navigator.vibrate(15);

/* ================= Fenster ================= */
function openApp(id){
 if(EDIT||LOCKED||SETUPON) return;
 const a=getApp(id); if(!a) return;
 toggleCC(false);
 CUR=id;
 $('sheet-title').textContent=a.n;
 renderSheet();
 $('sheet').classList.add('open');
}
function renderSheet(){
 if(!CUR||CUR.startsWith('__')) return;
 const a=getApp(CUR); if(!a) return;
 const b=$('sheet-body');
 const fresh=b.dataset.cur!==CUR;
 b.dataset.cur=CUR;
 if(a.html){
  b.classList.add('frame');
  if(fresh||!b.querySelector('iframe')) b.innerHTML='<iframe sandbox="allow-scripts" srcdoc="'+esc(a.html)+'"></iframe>';
  return;
 }
 b.classList.remove('frame');
 const f=VIEWS[CUR];
 b.innerHTML=`<div class="sa">${f?f():'<p class="note">Kommt bald.</p>'}</div>`;
}
function closeApp(){
 $('sheet').classList.remove('open');
 camStop();
 CUR=null;
 const b=$('sheet-body');
 b.dataset.cur='';
 setTimeout(()=>{ if(!CUR){ b.innerHTML=''; b.classList.remove('frame'); } },420);
}
function refreshAll(){
 renderWidgets();
 if(CUR) renderSheet();
 if($('cc').classList.contains('open')) renderCC();
}

 <div class="cgrid">${['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','%','0','.','='].map(k=>`<button class="cbtn ${'÷×−+='.includes(k)?'op':''}" data-act="calc" data-k="${k}">${k}</button>`).join('')}</div>`;
function calcKey(k){
 if(k==='C') CALC='';
 else if(k==='⌫') CALC=CALC.slice(0,-1);
 else if(k==='='){
  try{
   const x=CALC.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
   if(!/^[0-9+\-*\/(). %]*$/.test(x)) throw new Error('bad');
   const r=Function('"use strict";return ('+x.replace(/%/g,'/100')+');')();
   CALC=Number.isFinite(r)?String(+r.toFixed(10)):'Fehler';
  }catch(e){CALC='Fehler';}
 } else {
  if(CALC==='Fehler') CALC='';
  CALC+=k;
 }
 renderSheet();
}

/* ================= Musik ================= */
function mPlay(i){
 if(!MUS.list.length){toast('Erst Musik hinzufügen');return;}
 MUS.i=i; MUS.a.src=MUS.list[i].url; MUS.a.volume=S.vol;
 MUS.a.play().catch(()=>toast('Abspielen nicht möglich'));
 refreshAll();
}
function mToggle(){
 if(!MUS.list.length){toast('Erst Musik hinzufügen');return;}
 if(!MUS.a.src){mPlay(MUS.i);return;}
 if(MUS.a.paused) MUS.a.play().catch(()=>{}); else MUS.a.pause();
 refreshAll();
}
function mNext(){if(MUS.list.length)mPlay((MUS.i+1)%MUS.list.length);}
function mPrev(){if(MUS.list.length)mPlay((MUS.i-1+MUS.list.length)%MUS.list.length);}
function addMusic(files){
 for(const f of files) MUS.list.push({name:f.name,url:URL.createObjectURL(f)});
 refreshAll();
}
MUS.a.addEventListener('ended',mNext);
MUS.a.addEventListener('play',refreshAll);
MUS.a.addEventListener('pause',refreshAll);

/* ================= Szenen, Foto, Kamera, Bluetooth, Agen ================= */
function runScene(k){
 if(k==='ankommen'){S.rooms.forEach(r=>r.on=true);S.heat=3;toast('Willkommen zu Hause');}
 if(k==='tuer'){S.doorLocked=!S.doorLocked;toast(S.doorLocked?'Tür verriegelt':'Tür entriegelt');}
 if(k==='kino'){S.rooms[0].on=true;S.rooms[0].b=20;toast('Kino-Modus');}
 if(k==='aus'){S.rooms.forEach(r=>r.on=false);toast('Alle Lichter aus');}
 save(); refreshAll();
}
function pickPhoto(file){
 if(!file) return;
 const img=new Image();
 img.onload=()=>{
  const sc=Math.min(1,1280/img.width);
  const c=document.createElement('canvas');
  c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  S.bg=c.toDataURL('image/jpeg',0.82); save(); applyTheme(); refreshAll(); toast('Hintergrund gesetzt');
 };
 img.src=URL.createObjectURL(file);
}
async function camStart(){
 try{
  CAM=await navigator.mediaDevices.getUserMedia({video:true});
  const v=$('cv'); if(v){v.srcObject=CAM;v.style.display='block';}
  const p=$('cph'); if(p) p.style.display='none';
 }catch(e){toast('Kamera nicht verfügbar');}
}
function camShot(){
 const v=$('cv');
 if(!CAM||!v){toast('Erst Kamera starten');return;}
 const c=document.createElement('canvas');
 c.width=v.videoWidth||1280; c.height=v.videoHeight||720;
 c.getContext('2d').drawImage(v,0,0,c.width,c.height);
 const a=document.createElement('a');
 a.href=c.toDataURL('image/jpeg',0.92); a.download='foto-'+Date.now()+'.jpg'; a.click();
 toast('Foto gespeichert');
}
function camStop(){
 if(CAM){CAM.getTracks().forEach(t=>t.stop());CAM=null;}
 const v=$('cv'); if(v) v.style.display='none';
 const p=$('cph'); if(p) p.style.display='';
}
async function scanBT(){
 if(!navigator.bluetooth){toast('Bluetooth nicht verfügbar (Chrome auf Android nötig)');return;}
 try{
  const d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['battery_service']});
  const entry={n:d.name||'Unbekanntes Gerät',id:d.id,connected:false,batt:null};
  S.bt=S.bt.filter(x=>x.id!==d.id); S.bt.push(entry);
  d.addEventListener('gattserverdisconnected',()=>{entry.connected=false;save();if(CUR==='devices')renderSheet();});
  const server=await d.gatt.connect(); entry.connected=true;
  try{
   const svc=await server.getPrimaryService('battery_service');
   const ch=await svc.getCharacteristic('battery_level');
   const val=await ch.readValue(); entry.batt=val.getUint8(0);
  }catch(e){}
  save(); renderSheet(); toast('Verbunden');
 }catch(e){toast('Verbindung abgebrochen');}
}
async function respond(q){
 const l=q.toLowerCase();
 if(/licht.*(aus|off)|alles aus/.test(l)){S.rooms.forEach(r=>r.on=false);return 'Alle Lichter sind aus.';}
 if(/licht.*(an|ein|on)/.test(l)){S.rooms.forEach(r=>r.on=true);return 'Alle Lichter sind an.';}
 const m=l.match(/stufe\s*([1-5])/);
 if(m){S.heat=+m[1];return 'Heizung auf Stufe '+S.heat+'.';}
 if(/wie spät|uhrzeit|wie viel uhr/.test(l)) return 'Es ist '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr.';
 if(/wetter/.test(l)){const w=WX[S.city]||WX.Wildeshausen;return S.city+': '+w.t+' °C, '+w.c.toLowerCase()+' (Beispieldaten).';}
 if(S.agenUrl){
  try{
   const r=await fetch(S.agenUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});
   const txt=await r.text();
   try{const j=JSON.parse(txt);return j.reply||j.text||txt;}catch(e){return txt;}
  }catch(e){return 'Der Endpunkt antwortet nicht: '+e.message;}
 }
 return 'Ich kann Lichter, Heizung und Uhrzeit steuern. Für freie Fragen trage in den Einstellungen einen Endpunkt ein.';
}
async function askAgent(){
 const inp=$('ain'); if(!inp) return;
 const q=inp.value.trim(); if(!q) return;
 inp.value='';
 S.chat.push({r:'me',t:q}); S.chat=S.chat.slice(-50); save(); renderSheet();
 const a=await respond(q);
 S.chat.push({r:'ai',t:a}); S.chat=S.chat.slice(-50); save(); refreshAll();
}

/* ================= Store ================= */
function installCatalog(id){
 const a=CATALOG.find(x=>x.id===id); if(!a) return;
 S.custom[a.id]={id:a.id,n:a.n,i:a.i,c:a.c,desc:a.desc,html:buildSrcdoc(a.body,a.js)};
 if(!S.apps.includes(a.id)) S.apps.push(a.id);
 save(); renderPages(); renderSheet(); toast(a.n+' installiert');
}
function addCustom(j){
 if(!j||!j.n||!j.html){toast('App unvollständig');return;}
 const id='x'+uid();
 S.custom[id]={id:id,n:String(j.n),i:String(j.i||j.n.charAt(0)).slice(0,2),
  c:(Array.isArray(j.c)&&j.c.length===2)?j.c:['#0a84ff','#0050c8'],desc:j.desc||'Installierte App',html:String(j.html)};
 S.apps.push(id);
 save(); renderPages(); renderSheet(); toast(j.n+' installiert');
}
function installFile(file){
 const r=new FileReader();
 r.onload=()=>{try{addCustom(JSON.parse(r.result));}catch(e){toast('Datei ungültig');}};
 r.readAsText(file);
}

/* ================= Sicherung ================= */
function exportData(){
 const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob); a.download='agen-sicherung.json'; a.click();
}
function importData(file){
 const r=new FileReader();
 r.onload=()=>{
  try{
   S=Object.assign(clone(DEF),JSON.parse(r.result));
   save(); applyTheme(); renderPages(); refreshAll(); toast('Sicherung geladen');
  }catch(e){toast('Datei ungültig');}
 };
 r.readAsText(file);
}

/* ================= Aktionen (alle Klicks) ================= */
const ACT={
 lockNow:()=>showLock(),
 closeApp:()=>closeApp(),
 doneEdit:()=>exitEdit(),
 ccTog:ds=>{S.cc[ds.k]=!S.cc[ds.k];save();renderCC();},
 mToggle:()=>mToggle(),
 mNext:()=>mNext(),
 mPrev:()=>mPrev(),
 mPlay:ds=>mPlay(+ds.i),
 heatAdj:ds=>{S.heat=clamp(S.heat+(+ds.d),1,5);save();refreshAll();},
 scene:ds=>runScene(ds.k),
 wdel:ds=>{const list=WIDGETS();const i=list.findIndex(w=>w.id===ds.id);if(i>-1)list.splice(i,1);save();renderWidgets();},
 addWidget:()=>openWidgetPicker(),
 pickWidget:ds=>addWidget(ds.t),
 openStore:()=>{exitEdit();openApp('store');},
 removeApp:ds=>{S.apps=S.apps.filter(x=>x!==ds.id);save();renderPages();toast('Vom Home-Bildschirm entfernt');},
 clockTab:ds=>{CLOCK_TAB=ds.k;renderSheet();},
 alarmAdd:()=>{const t=$('al-t').value,l=$('al-l').value.trim();if(!t)return;S.alarms.push({t:t,l:l,on:true});save();renderSheet();},
 alarmTog:ds=>{S.alarms[+ds.i].on=!S.alarms[+ds.i].on;save();renderSheet();},
 alarmDel:ds=>{S.alarms.splice(+ds.i,1);save();renderSheet();},
 tmSet:ds=>{TMDUR=+ds.m*60000;TM={rem:TMDUR,end:0};renderSheet();},
 tmStart:()=>{
  if(TM.end){TM={rem:tmLeft(),end:0};}
  else{const r=TM.rem||TMDUR;TM={rem:r,end:Date.now()+r};}
  renderSheet();
 },
 tmReset:()=>{TM={rem:TMDUR,end:0};renderSheet();},
 swToggle:()=>{
  if(SW.run){SW.acc=swMs();SW.run=false;}
  else{SW.start=Date.now();SW.run=true;}
  renderSheet();
 },
 swReset:()=>{SW={acc:0,start:0,run:false};renderSheet();},
 listAdd:ds=>{
  const inp=$('in-'+ds.key); if(!inp) return;
  const t=inp.value.trim(); if(!t) return;
  S[ds.key].push({t:t,done:false}); save(); renderSheet();
  const n=$('in-'+ds.key); if(n) n.focus();
 },
 listToggle:ds=>{const x=S[ds.key][+ds.i];if(x){x.done=!x.done;save();renderSheet();}},
 listDel:ds=>{S[ds.key].splice(+ds.i,1);save();renderSheet();},
 calc:ds=>calcKey(ds.k),
 evAdd:()=>{
  const d=$('ev-d').value, t=$('ev-t').value, n=$('ev-n').value.trim();
  if(!d||!n){toast('Datum und Titel angeben');return;}
  S.events.push({id:uid(),d:d,t:t,n:n}); save(); refreshAll();
 },
 evDel:ds=>{S.events=S.events.filter(e=>e.id!==ds.id);save();refreshAll();},
 roomTog:ds=>{S.rooms[+ds.i].on=!S.rooms[+ds.i].on;save();refreshAll();},
 roomDel:ds=>{S.rooms.splice(+ds.i,1);save();refreshAll();},
 roomAdd:()=>{const n=$('rn').value.trim();if(!n)return;S.rooms.push({n:n,on:false,b:80});save();refreshAll();},
 announce:()=>{
  const t=$('ic-t').value.trim(); if(!t) return;
  const ri=$('ic-r').value;
  const room=ri===''?'Alle':S.rooms[+ri].n;
  speak((ri===''?'':S.rooms[+ri].n+': ')+t);
  S.ilog.unshift({txt:room+': '+t,t:timeStr(new Date())});
  S.ilog=S.ilog.slice(0,20);
  save(); toast('Angesagt'); renderSheet();
 },
 ring:()=>{speak('Es klingelt an der Tür');toast('Klingel');},
 camStart:()=>camStart(),
 camShot:()=>camShot(),
 camStop:()=>camStop(),
 btScan:()=>scanBT(),
 btForget:ds=>{S.bt.splice(+ds.i,1);save();renderSheet();},
 agenSend:()=>askAgent(),
 stepsAdd:()=>{
  const v=+$('stp').value; if(!v) return;
  const k=dayKey(); S.steps[k]=(S.steps[k]||0)+v; save(); refreshAll();
 },
 sleepAdd:()=>{
  const v=+$('slp').value; if(!v) return;

 restoreApp:ds=>{if(!S.apps.includes(ds.id)) S.apps.push(ds.id);save();renderPages();renderSheet();},

 toggle:ds=>{S[ds.k]=!S[ds.k];save();applyTheme();refreshAll();},
 accent:ds=>{S.accent=ds.c;save();applyTheme();refreshAll();},
 unit:ds=>{S.unit=ds.u;save();refreshAll();},
 setWP:ds=>{S.bg=null;S.wp=+ds.i;save();applyTheme();refreshAll();},
 startEdit:()=>{closeApp();setTimeout(()=>{renderPages();enterEdit();},80);},
 layoutReset:()=>{S.widgets={land:[],port:[]};save();renderWidgets();refreshAll();toast('Widgets zurückgesetzt');},
 setupAgain:()=>{

 },
 exportData:()=>exportData(),

 suNext:()=>{SU.step=Math.min(3,SU.step+1);renderSetup();},
 suBack:()=>{SU.step=Math.max(0,SU.step-1);renderSetup();},
 suWP:ds=>{SU.wp=+ds.i;renderSetup();},
 suLight:ds=>{SU.light=ds.v==='1';renderSetup();},
 suAcc:ds=>{SU.accent=ds.c;renderSetup();},
 suAnim:()=>{SU.anim=!SU.anim;renderSetup();},
 suCheck:ds=>{
  const arr=ds.kind==='w'?SU.widgets:SU.apps;
  const i=arr.indexOf(ds.v);

 suFinish:()=>{SETUPON=false;finishSetup();}

/* ================= Eingaben ================= */
document.addEventListener('input',e=>{
 const t=e.target, k=t.dataset.in; if(!k) return;
 const v=t.value;
 if(k==='suname'){SU.name=v;return;}
 if(k==='bright'){S.bright=+v;applyTheme();}
 else if(k==='vol'){S.vol=+v/100;MUS.a.volume=S.vol;}
 else if(k==='room'){const r=S.rooms[+t.dataset.i];if(r) r.b=+v;}
 else if(k==='note'){S.note=v;}
 else if(k==='name'){S.name=v;}
 else if(k==='agen'){S.agenUrl=v.trim();}
 else if(k==='blur'){S.blur=+v;applyTheme();}
 else if(k==='icon'){S.is=+v;applyTheme();}
 else if(k==='city'){S.city=v;renderWidgets();}
 save();
});
document.addEventListener('change',e=>{
 const t=e.target, f=t.dataset.file; if(!f) return;
 const files=t.files; if(!files||!files.length) return;
 if(f==='music') addMusic(files);
 else if(f==='photo') pickPhoto(files[0]);
 else if(f==='installFile') installFile(files[0]);
 else if(f==='import') importData(files[0]);
 else if(f==='files') {}
 t.value='';
});
document.addEventListener('keydown',e=>{
 const t=e.target;
 if(e.key==='Enter'&&t.dataset&&t.dataset.enter&&ACT[t.dataset.enter]){ACT[t.dataset.enter](t.dataset);return;}
 if(e.key==='Escape'){closeApp();toggleCC(false);exitEdit();return;}
 if(CUR==='calc'&&!/INPUT|TEXTAREA|SELECT/.test(t.tagName)){
  const map={'/':'÷','*':'×','-':'−','Enter':'=','=':'=','Backspace':'⌫'};
  const k=map[e.key]||e.key;
  if(/^[0-9.()+%]$/.test(k)||['÷','×','−','=','⌫','C'].includes(k)){calcKey(k);e.preventDefault();}
 }
});

/* ================= Klicks ================= */
document.addEventListener('click',e=>{
 if(IGN){IGN=false;return;}
 const act=e.target.closest('[data-act]');
 if(SETUPON){
  if(act&&ACT[act.dataset.act]) ACT[act.dataset.act](act.dataset,act);
  return;
 }
 if(LOCKED){
  if(e.target.closest('#lock')) unlockNow();
  return;
 }
 if(e.target.id==='cc'){toggleCC(false);return;}
 if(act){ if(ACT[act.dataset.act]) ACT[act.dataset.act](act.dataset,act); return; }
 const app=e.target.closest('.app');
 if(app){ if(!EDIT) openApp(app.dataset.app); return; }
 const w=e.target.closest('.w');
 if(w){
  if(!EDIT){
   const wd=WIDGETS().find(x=>x.id===w.dataset.wid);
   const d=wd&&WID[wd.t];
   if(d&&d.app) openApp(d.app);
  }
  return;
 }
 if(EDIT&&!e.target.closest('#editbar')) exitEdit();
});

/* ================= Ziehen, lange drücken, wischen ================= */
document.addEventListener('pointerdown',e=>{
 IGN=false;
 START={x:e.clientX,y:e.clientY};
 if(SETUPON||LOCKED) return;
 if(e.target.closest('[data-act],#editbar,#cc,#sheet,input,textarea,select,button,iframe')) return;
 const w=e.target.closest('.w'), a=e.target.closest('.app');
 if(EDIT){
  if(w){
   const wd=WIDGETS().find(x=>x.id===w.dataset.wid);
   if(wd) DRAG={mode:e.target.closest('.wres')?'res':'move',el:w,wd:wd,x:e.clientX,y:e.clientY,moved:false,dx:0,dy:0,nw:0,nh:0};
  } else if(a){
   DRAG={mode:'app',id:a.dataset.app,x:e.clientX,y:e.clientY,moved:false};
  }
  return;
 }
 if(w||a){
  PRESS={x:e.clientX,y:e.clientY,t:setTimeout(()=>{PRESS=null;IGN=true;enterEdit();},450)};
 }
});
document.addEventListener('pointermove',e=>{
 if(PRESS&&Math.hypot(e.clientX-PRESS.x,e.clientY-PRESS.y)>10){clearTimeout(PRESS.t);PRESS=null;}
 if(!DRAG) return;
 const dx=(e.clientX-DRAG.x)/SC, dy=(e.clientY-DRAG.y)/SC;
 if(!DRAG.moved&&Math.hypot(dx,dy)<4) return;
 DRAG.moved=true; IGN=true;
 if(DRAG.mode==='move'){
  DRAG.dx=dx; DRAG.dy=dy;
  DRAG.el.classList.add('lift');
  DRAG.el.style.transform='translate('+dx+'px,'+dy+'px)';
 } else if(DRAG.mode==='res'){
  const wd=DRAG.wd;
  const nw=clamp(Math.round((wd.w*CW-G+dx)/CW),1,COLS-wd.x);
  const nh=clamp(Math.round((wd.h*CH-G+dy)/CH),1,ROWS-wd.y);
  DRAG.nw=nw; DRAG.nh=nh;
  DRAG.el.classList.add('lift');
  DRAG.el.style.width=(nw*CW-G)+'px';
  DRAG.el.style.height=(nh*CH-G)+'px';
 } else if(DRAG.mode==='app'){
  const under=document.elementFromPoint(e.clientX,e.clientY);
  const tg=under&&under.closest?under.closest('.app'):null;
  if(tg&&tg.dataset.app&&tg.dataset.app!==DRAG.id){
   const from=S.apps.indexOf(DRAG.id), to=S.apps.indexOf(tg.dataset.app);
   if(from>-1&&to>-1){
    S.apps.splice(from,1);
    S.apps.splice(to,0,DRAG.id);
    renderPages();
   }
  }
 }
});
document.addEventListener('pointerup',e=>{
 if(PRESS){clearTimeout(PRESS.t);PRESS=null;}
 const dx=e.clientX-START.x, dy=e.clientY-START.y;
 if(SETUPON){DRAG=null;return;}
 if(LOCKED){
  if(dy<-40&&Math.abs(dy)>Math.abs(dx)) unlockNow();
  DRAG=null;
  return;
 }
 if(!EDIT&&!CUR&&START.y<50&&dy>40&&START.x>innerWidth/2&&!$('cc').classList.contains('open')) toggleCC(true);
 if(DRAG){
  const D=DRAG; DRAG=null;
  if(D.moved){
   if(D.mode==='move'){
    const wd=D.wd;
    const nx=clamp(Math.round(wd.x+D.dx/CW),0,Math.max(0,COLS-wd.w));
    const ny=clamp(Math.round(wd.y+D.dy/CH),0,Math.max(0,ROWS-wd.h));
    if(!collides(wd,nx,ny,wd.w,wd.h)){wd.x=nx;wd.y=ny;}
   } else if(D.mode==='res'&&D.nw){
    const wd=D.wd;
    if(!collides(wd,wd.x,wd.y,D.nw,D.nh)){wd.w=D.nw;wd.h=D.nh;}
   }
   save();
   renderWidgets();
  }
 }

applyTheme();

tick();

 SETUPON=true;
 SU={step:0,name:'',wp:0,light:false,accent:'#0a84ff',anim:true,widgets:DEFAULT_TYPES.slice(),apps:APPKEYS.slice()};
 $('lock').classList.add('hide');
 renderSetup();
 $('setup').classList.remove('hide');

 showLock();
 renderPages();
