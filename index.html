<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Agen Home Hub</title>
<style>
:root{
  --font:"Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --txt:#fff; --dim:rgba(255,255,255,.66);
  --blue:#0a84ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--txt);background:#000;user-select:none;-webkit-user-select:none}
svg{display:block}

/* ---------- Hintergrund ---------- */
#wall{position:fixed;inset:0;z-index:-1;transition:background .8s}
.wp0{background:radial-gradient(120% 80% at 75% 0%,#f0b68a 0%,transparent 60%),radial-gradient(90% 70% at 0% 100%,#c97b55 0%,transparent 70%),linear-gradient(#b5764f,#6e4130)}
.wp1{background:radial-gradient(110% 70% at 80% 0%,#4f8bff 0%,transparent 55%),radial-gradient(100% 80% at 10% 100%,#1b2262 0%,transparent 70%),linear-gradient(#1c2352,#070916)}
.wp2{background:radial-gradient(100% 70% at 20% 0%,#ff9d74 0%,transparent 55%),radial-gradient(90% 80% at 100% 100%,#b24d86 0%,transparent 60%),linear-gradient(#2b1a33,#120a16)}
.wp3{background:radial-gradient(100% 70% at 50% 0%,#f4f6fb 0%,transparent 60%),linear-gradient(#cfd8e8,#8e9bb6)}

/* ---------- Liquid Glass ---------- */
.glass{position:relative;overflow:hidden;border-radius:var(--r,26px);
  background:linear-gradient(160deg,rgba(255,255,255,.30),rgba(255,255,255,.07));
  -webkit-backdrop-filter:blur(34px) saturate(185%);backdrop-filter:blur(34px) saturate(185%);
  box-shadow:0 14px 40px rgba(0,0,0,.22),inset 0 0 0 1px rgba(255,255,255,.2),inset 0 1.5px 0 rgba(255,255,255,.55)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.16) 47%,transparent 60%)}
.glass.dark{background:linear-gradient(160deg,rgba(20,24,40,.55),rgba(20,24,40,.25))}

/* ---------- Schalter / Tasten ---------- */
.pill{border:0;border-radius:999px;color:#fff;font:inherit;font-weight:600;font-size:16px;padding:14px 22px;cursor:pointer;
  background:linear-gradient(160deg,rgba(255,255,255,.38),rgba(255,255,255,.10));
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 16px rgba(0,0,0,.2);transition:transform .15s}
.pill:active{transform:scale(.96)}
.pill.blue{background:linear-gradient(160deg,#3d9dff,#0a84ff)}
.switch{width:51px;height:31px;border-radius:999px;background:rgba(120,120,128,.55);position:relative;flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .25s}
.switch.on{background:#34c759}.switch.on::after{transform:translateX(20px)}
.hide{display:none!important}

/* ---------- Einrichtung ---------- */
#setup{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:24px}
#setup .card{--r:34px;width:min(460px,100%);padding:36px 28px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
#setup h1{font-size:28px;font-weight:700;letter-spacing:-.4px}
#setup p{color:var(--dim);font-size:16px;line-height:1.45}
.field{width:100%;padding:15px 18px;border-radius:16px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:17px;outline:none}
.field::placeholder{color:rgba(255,255,255,.55)}
.wp-row{display:flex;gap:12px}
.wp-pick{width:60px;height:60px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.wp-pick.sel{border-color:#fff}
.dots{display:flex;gap:7px}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}.dots i.on{background:#fff}

/* ---------- Sperrbildschirm ---------- */
#lock{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;padding-top:14vh;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s}
#lock.gone{transform:translateY(-100%);opacity:0;pointer-events:none}
.lock-time{font-size:min(30vw,170px);font-weight:300;letter-spacing:-4px;line-height:.95;font-variant-numeric:tabular-nums;
  text-shadow:0 2px 24px rgba(0,0,0,.18)}
.lock-date{margin-top:8px;font-size:20px;font-weight:500;color:rgba(255,255,255,.9)}
.lock-foot{position:absolute;bottom:42px;left:0;right:0;text-align:center;font-size:14px;color:rgba(255,255,255,.8)}
.lock-foot span{display:inline-block;width:40px;height:5px;border-radius:5px;background:rgba(255,255,255,.7);margin-bottom:10px}

/* ---------- Startbildschirm ---------- */
#home{position:fixed;inset:0;padding:16px 22px 120px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.status{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;padding:2px 6px;font-variant-numeric:tabular-nums}
.status .ico{display:flex;gap:8px;align-items:center}
.widgets{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:16px;width:100%;max-width:820px;margin:0 auto}
.w-therm{--r:30px;grid-row:span 2;padding:18px;display:flex;flex-direction:column;justify-content:space-between;min-height:320px}
.w-clock{--r:30px;padding:14px;display:flex;align-items:center;justify-content:center;min-height:150px}
.w-clock .face{width:100%;max-width:150px}
.w-int{--r:30px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;min-height:150px}
.label{font-size:15px;font-weight:600}
.label small{display:block;font-size:13px;color:var(--dim);font-weight:500;margin-top:2px}
.temp{font-size:110px;font-weight:200;letter-spacing:-5px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.temp-ctl{display:flex;justify-content:space-between;align-items:center}
.chev{width:44px;height:44px;border-radius:50%;border:0;color:#fff;cursor:pointer;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.chev:active{transform:scale(.92)}
.scenes{grid-column:1/3;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{--r:28px;min-height:110px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile.on{background:linear-gradient(160deg,rgba(10,132,255,.95),rgba(10,100,230,.85))}
.tile .ico-s{width:30px;height:30px}

/* ---------- App-Raster ---------- */
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 10px;justify-items:center;width:100%;max-width:820px;margin:0 auto}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;width:80px}
.app .ic{width:70px;height:70px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.12),0 6px 16px rgba(0,0,0,.25);transition:transform .15s}
.app:active .ic{transform:scale(.9)}
.app .ic svg{width:36px;height:36px}
.app .nm{font-size:12.5px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.45);text-align:center;white-space:nowrap}

.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:18px;padding:12px 18px;border-radius:36px;--r:36px;z-index:20}
.dock .app{width:auto}
.dock .app .ic{width:62px;height:62px;border-radius:17px}
.dock .app .nm{display:none}

/* ---------- Kontrollzentrum ---------- */
#cc{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .3s}
#cc.open{opacity:1;pointer-events:auto}
#cc .panel{--r:34px;position:absolute;top:12px;right:12px;width:min(390px,calc(100% - 24px));padding:16px;display:flex;flex-direction:column;gap:12px;
  transform:translateY(-16px) scale(.97);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#cc.open .panel{transform:none}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc-tile{--r:24px;padding:16px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;cursor:pointer}
.cc-tile.on{background:linear-gradient(160deg,rgba(10,132,255,.95),rgba(10,100,230,.85))}
.cc-tile svg{width:22px;height:22px}
.cc-slider{--r:24px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:14px;font-weight:600}
.cc-slider input{width:100%;accent-color:#fff}

/* ---------- App-Fenster ---------- */
#sheet{position:fixed;inset:8px;z-index:40;display:flex;flex-direction:column;--r:36px;
  transform:scale(.9);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s}
#sheet.open{transform:none;opacity:1;pointer-events:auto}
.sheet-top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.18);position:relative;z-index:1}
.sheet-top h2{font-size:20px;font-weight:700}
.x{width:36px;height:36px;border-radius:50%;border:0;color:#fff;font-size:17px;cursor:pointer;background:rgba(255,255,255,.2)}
#sheet-body{flex:1;overflow-y:auto;padding:18px 20px 30px;position:relative;z-index:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 16px;border-radius:18px;margin-bottom:10px;background:rgba(255,255,255,.12);font-size:16px}
.row small{display:block;color:var(--dim);font-size:13px;margin-top:3px}
.note{color:var(--dim);font-size:13px;margin-top:12px;line-height:1.4}
.bubble{padding:12px 16px;border-radius:20px;max-width:80%;font-size:15px;line-height:1.4;margin-bottom:10px}
.bubble.me{margin-left:auto;background:linear-gradient(160deg,#3d9dff,#0a84ff)}
.bubble.ai{background:rgba(255,255,255,.16)}
.big{font-size:min(20vw,110px);font-weight:200;text-align:center;font-variant-numeric:tabular-nums;margin:20px 0 4px}
textarea.field{min-height:260px;resize:vertical;line-height:1.5}
</style>
</head>
<body>
<div id="wall" class="wp0"></div>

<!-- Einrichtung -->
<div id="setup" class="hide"><div class="glass card" id="setup-card"></div></div>

<!-- Sperrbildschirm -->
<div id="lock" class="hide">
  <div class="lock-time" id="lk-time">--:--</div>
  <div class="lock-date" id="lk-date"></div>
  <div class="lock-foot"><span></span><br>Nach oben wischen zum Öffnen</div>
</div>

<!-- Startbildschirm -->
<div id="home" class="hide">
  <div class="status">
    <span id="sb-time"></span>
    <span class="ico" id="sb-ico"></span>
  </div>
  <div class="widgets">
    <div class="glass w-therm">
      <div class="label">Thermostat<small>Wohnzimmer</small></div>
      <div class="temp" id="temp">21</div>
      <div class="temp-ctl">
        <button class="chev" onclick="setTemp(-1)" aria-label="kälter"></button>
        <span class="label" style="font-weight:500;color:var(--dim)">Heizen</span>
        <button class="chev" onclick="setTemp(1)" aria-label="wärmer"></button>
      </div>
    </div>
    <div class="glass w-clock" id="w-clock" onclick="openApp('clock')"></div>
    <div class="glass w-int" onclick="openApp('intercom')">
      <div class="label">Gegensprechen<small>Überall im Haus</small></div>
      <div id="int-ico" style="align-self:center"></div>
    </div>
    <div class="scenes" id="scenes"></div>
  </div>
  <div class="apps" id="apps"></div>
</div>

<div id="dock" class="dock glass hide"></div>

<!-- Kontrollzentrum -->
<div id="cc" onclick="if(event.target===this)toggleCC(false)">
  <div class="glass panel">
    <div class="cc-grid">
      <div class="glass cc-tile on" onclick="this.classList.toggle('on')" id="t-wifi"><span data-i="wifi"></span>WLAN</div>
      <div class="glass cc-tile on" onclick="this.classList.toggle('on')" id="t-bt"><span data-i="bt"></span>Bluetooth</div>
      <div class="glass cc-tile" onclick="this.classList.toggle('on')"><span data-i="moon"></span>Fokus</div>
      <div class="glass cc-tile" onclick="this.classList.toggle('on')"><span data-i="plane"></span>Flugmodus</div>
    </div>
    <div class="glass cc-slider"><span>Helligkeit</span><input type="range" min="30" max="100" value="90" oninput="document.getElementById('home').style.opacity=this.value/100"></div>
    <div class="glass cc-slider"><span>Lautstärke</span><input type="range" min="0" max="100" value="60"></div>
    <button class="pill" style="width:100%" onclick="lockScreen()">Sperren</button>
  </div>
</div>

<!-- App-Fenster -->
<div id="sheet" class="glass dark">
  <div class="sheet-top">
    <h2 id="sheet-title"></h2>
    <button class="x" onclick="closeApp()" aria-label="schließen">✕</button>
  </div>
  <div id="sheet-body"></div>
</div>

<script>
/* ============ Zustand ============ */
const KEY='agenHub2';
const DEF={setup:false,name:'',wp:0,temp:21,
  rooms:{'Wohnzimmer':true,'Küche':false,'Schlafzimmer':false},
  scenes:{ankommen:false,tuer:true,licht:false},notes:''};
let S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'));
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const $=id=>document.getElementById(id);

/* ============ Icons (eigene SVG-Linien) ============ */
const P={
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1V17h5v-1c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  therm:'<path d="M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z"/>',
  cam:'<rect x="3" y="7" width="13" height="11" rx="2.5"/><path d="M16 10.5l5-3v9l-5-3"/>',
  bt:'<path d="M7 7l10 10-5 5V2l5 5L7 17"/>',
  note:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="3.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  wave:'<path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/>',
  chevU:'<path d="M6 15l6-6 6 6"/>',
  chevD:'<path d="M6 9l6 6 6-6"/>',
  wifi:'<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  plane:'<path d="M3 13l18-7-7 18-2-7z"/>',
};
const ic=(n,s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
document.querySelectorAll('[data-i]').forEach(el=>el.innerHTML=ic(el.dataset.i,22));

/* ============ Apps ============ */
const APPS=[
  {id:'lights',name:'Lichter',icon:'bulb',c:['#ffd60a','#ff9f0a']},
  {id:'therm',name:'Heizung',icon:'therm',c:['#ff8a5c','#ff3b30']},
  {id:'cam',name:'Kamera',icon:'cam',c:['#8e8e93','#48484a']},
  {id:'bt',name:'Geräte',icon:'bt',c:['#0a84ff','#0050c8']},
  {id:'cal',name:'Kalender',icon:'cal',c:['#ff5e57','#d70015']},
  {id:'weather',name:'Wetter',icon:'sun',c:['#64d2ff','#0a7fd8']},
  {id:'notes',name:'Notizen',icon:'note',c:['#ffe066','#f5b800']},
  {id:'set',name:'Einstellungen',icon:'gear',c:['#8e8e93','#5a5a60']},
];
const DOCK=[{id:'agen',name:'Agen',icon:'spark',c:['#bf7bff','#7d3cff']},{id:'notes',name:'Notizen',icon:'note',c:['#ffe066','#f5b800']},{id:'cam',name:'Kamera',icon:'cam',c:['#8e8e93','#48484a']},{id:'lights',name:'Lichter',icon:'bulb',c:['#ffd60a','#ff9f0a']}];
const tile=a=>`<div class="app" onclick="openApp('${a.id}')"><div class="ic" style="background:linear-gradient(160deg,${a.c[0]},${a.c[1]})">${ic(a.icon,36)}</div><div class="nm">${a.name}</div></div>`;
const WPS=['wp0','wp1','wp2','wp3'];
const WPNAMES=['Warm','Nacht','Abend','Hell'];

/* ============ Einrichtung ============ */
let step=0;
function renderSetup(){
  const dots=`<div class="dots">${[0,1,2].map(i=>`<i class="${i===step?'on':''}"></i>`).join('')}</div>`;
  const c=$('setup-card');
  if(step===0) c.innerHTML=`<div style="width:86px;height:86px;border-radius:24px;background:linear-gradient(160deg,#bf7bff,#7d3cff);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)">${ic('spark',46)}</div>
    <h1>Willkommen bei Agen</h1><p>Dein Home Hub für Zuhause, Geräte und Assistent.</p>${dots}
    <button class="pill blue" onclick="step=1;renderSetup()">Weiter</button>`;
  if(step===1) c.innerHTML=`<h1>Wie heißt du?</h1><p>Damit der Hub dich begrüßt.</p>
    <input class="field" id="sname" placeholder="Dein Name" value="${S.name}">${dots}
    <button class="pill blue" onclick="S.name=$('sname').value.trim()||'Freund';step=2;renderSetup()">Weiter</button>`;
  if(step===2) c.innerHTML=`<h1>Hintergrund</h1><p>Später in den Einstellungen änderbar.</p>
    <div class="wp-row">${WPS.map((w,i)=>`<div class="wp-pick ${w} ${i===S.wp?'sel':''}" onclick="S.wp=${i};$('wall').className='${w}';renderSetup()"></div>`).join('')}</div>
    ${dots}<button class="pill blue" onclick="finishSetup()">Fertig</button>`;
}
function finishSetup(){S.setup=true;save();$('setup').classList.add('hide');lockScreen(true);}

/* ============ Uhr ============ */
function clockFace(){
  let s='<svg viewBox="-50 -50 100 100" style="width:100%;height:100%">';
  for(let i=0;i<12;i++) s+=`<line y1="-44" y2="${i%3?-40:-38}" transform="rotate(${i*30})" stroke="#fff" stroke-width="${i%3?1.2:2.6}" stroke-linecap="round"/>`;
  s+=`<line id="hh" y1="4" y2="-22" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>`;
  s+=`<line id="mh" y1="6" y2="-34" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>`;
  s+=`<line id="sh" y1="10" y2="-40" stroke="#ff453a" stroke-width="1"/><circle r="2.4" fill="#fff"/></svg>`;
  return s;
}
function tick(){
  const d=new Date();
  const t=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  $('sb-time').textContent=t;
  $('lk-time').textContent=t;
  $('lk-date').textContent=d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
  const h=d.getHours()%12,m=d.getMinutes(),s=d.getSeconds();
  const hh=$('hh'),mh=$('mh'),sh=$('sh');
  if(hh){hh.setAttribute('transform',`rotate(${h*30+m*0.5})`);mh.setAttribute('transform',`rotate(${m*6+s*0.1})`);sh.setAttribute('transform',`rotate(${s*6})`);}
}
setInterval(tick,1000);

/* ============ Startbildschirm ============ */
function renderHome(){
  $('wall').className=WPS[S.wp];
  $('w-clock').innerHTML=clockFace();
  $('int-ico').innerHTML=ic('wave',42);
  $('temp').textContent=S.temp;
  renderScenes();
  $('apps').innerHTML=APPS.map(tile).join('');
  $('dock').innerHTML=DOCK.map(tile).join('');
  $('sb-ico').innerHTML=`<svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><span style="font-size:13px;margin-left:6px">5G</span>`;
  tick();
}
function renderScenes(){
  const defs=[
    {k:'ankommen',n:'Ankommen',i:'lock'},
    {k:'tuer',n:'Tür',i:'lock'},
    {k:'licht',n:'Alles aus',i:'bulb'}
  ];
  $('scenes').innerHTML=defs.map(d=>`
    <div class="glass tile ${S.scenes[d.k]?'on':''}" onclick="runScene('${d.k}')">
      <div class="ico-s">${ic(d.i,30)}</div>
      <div class="label">${d.n}<small>${S.scenes[d.k]?'Aktiv':'Szene'}</small></div>
    </div>`).join('');
}
function runScene(k){
  S.scenes[k]=!S.scenes[k];
  if(k==='licht') Object.keys(S.rooms).forEach(r=>S.rooms[r]=false);
  if(k==='ankommen') Object.keys(S.rooms).forEach(r=>S.rooms[r]=true);
  save();renderScenes();
}
function setTemp(d){S.temp=Math.min(30,Math.max(10,S.temp+d));$('temp').textContent=S.temp;save();}

/* ============ Sperre ============ */
function lockScreen(first){
  $('lock').classList.remove('hide','gone');
  $('home').classList.add('hide');$('dock').classList.add('hide');
  toggleCC(false);
  if(first===true) return;
}
function unlock(){
  $('lock').classList.add('gone');
  setTimeout(()=>{$('lock').classList.add('hide');},500);
  $('home').classList.remove('hide');$('dock').classList.remove('hide');
  renderHome();
}

/* ============ Kontrollzentrum ============ */
function toggleCC(force){
  const el=$('cc');
  el.classList.toggle('open',typeof force==='boolean'?force:!el.classList.contains('open'));
}

/* ============ Wischgesten ============ */
let g=null;
document.addEventListener('pointerdown',e=>{g={x:e.clientX,y:e.clientY,t:Date.now()};});
document.addEventListener('pointerup',e=>{
  if(!g) return;
  const dx=e.clientX-g.x, dy=e.clientY-g.y;
  const sheetOpen=$('sheet').classList.contains('open');
  const locked=!$('lock').classList.contains('hide') && !$('lock').classList.contains('gone');
  if(locked && dy<-60 && Math.abs(dy)>Math.abs(dx)) unlock();
  else if(!locked && g.y<40 && dy>60 && g.x>innerWidth*0.4) toggleCC(true);
  else if(!locked && sheetOpen && dy>0 && g.y>innerHeight-120 && dy>80) closeApp();
  g=null;
});
$('lock').addEventListener('click',()=>{ if(!S.setup) return; unlock(); });

/* ============ App-Fenster ============ */
function openApp(id){
  const titles={agen:'Agen',intercom:'Gegensprechen',lights:'Lichter',therm:'Heizung',cam:'Kamera',bt:'Geräte',cal:'Kalender',weather:'Wetter',notes:'Notizen',set:'Einstellungen',clock:'Uhr'};
  $('sheet-title').textContent=titles[id]||'';
  $('sheet-body').innerHTML=body(id);
  $('sheet').classList.add('open');
}
function closeApp(){$('sheet').classList.remove('open');}

function toggleRoom(r){S.rooms[r]=!S.rooms[r];save();openApp('lights');renderScenes();}
function body(id){
  switch(id){
    case 'lights': return Object.keys(S.rooms).map(r=>`
      <div class="row"><div>${r}<small>${S.rooms[r]?'An':'Aus'}</small></div>
      <div class="switch ${S.rooms[r]?'on':''}" onclick="toggleRoom('${r}')"></div></div>`).join('');
    case 'therm': return `<div class="big">${S.temp}°</div>
      <div style="display:flex;justify-content:center;gap:14px;margin-top:20px">
        <button class="pill" onclick="setTemp(-1);openApp('therm')">−</button>
        <button class="pill" onclick="setTemp(1);openApp('therm')">+</button></div>
      <p class="note" style="text-align:center">Ziel für das Wohnzimmer. Echte Regelung braucht ein Thermostat mit Anbindung.</p>`;
    case 'intercom': return `<div class="row">Alle Räume<small>Nachricht an das ganze Haus</small></div>
      <div class="row">Wohnzimmer<small>Sprechen</small></div>
      <p class="note">Nur Demo. Echte Sprachübertragung braucht eine eigene Anbindung.</p>`;
    case 'cam': return `<div class="glass" style="--r:26px;height:260px;display:flex;align-items:center;justify-content:center">${ic('cam',60)}</div>
      <button class="pill blue" style="width:100%;margin-top:16px" onclick="startCam()">Kamera starten</button>`;
    case 'bt': return `<p class="note" style="margin:0 0 12px">Geräte in der Nähe suchen. Funktioniert in Chrome auf Android.</p>
      <button class="pill blue" style="width:100%" onclick="scanBT()">Suchen</button><div id="bt-list" style="margin-top:14px"></div>`;
    case 'agen': return `<div id="chat">
        <div class="bubble ai">Hi ${S.name||'Freund'}, was kann ich tun?</div></div>
      <div style="display:flex;gap:10px;margin-top:10px"><input class="field" id="ain" placeholder="Frag etwas" onkeydown="if(event.key==='Enter')askAgent()"><button class="pill blue" onclick="askAgent()">↑</button></div>`;
    case 'cal': return `<div class="row">Frühstück<small>09:00 · Heute</small></div>
      <div class="row">Projekt Review<small>14:00 · Heute</small></div>
      <p class="note">Beispieltermine.</p>`;
    case 'weather': return `<div class="big">14°</div><p style="text-align:center;color:var(--dim)">Bewölkt</p>
      <p class="note" style="text-align:center">Beispieldaten. Für echtes Wetter eine Wetter-API anbinden.</p>`;
    case 'notes': return `<textarea class="field" oninput="S.notes=this.value;save()" placeholder="Schreibe etwas…">${S.notes}</textarea>`;
    case 'set': return `<div class="row">Name<small>${S.name||'–'}</small></div>
      <div class="row" style="cursor:pointer" onclick="step=1;$('setup').classList.remove('hide');renderSetup()">Einrichtung ändern</div>
      <div class="row">Hintergrund<div style="display:flex;gap:8px">${WPS.map((w,i)=>`<div class="wp-pick ${w} ${i===S.wp?'sel':''}" style="width:30px;height:30px;border-width:2px" onclick="S.wp=${i};save();renderHome()"></div>`).join('')}</div></div>
      <div class="row">Version<small>Agen Home Hub 1.0</small></div>`;
    case 'clock': return `<div class="big" id="bigclk"></div><p class="note" style="text-align:center">${new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}</p>`;
  }
  return '';
}

/* ============ Kamera / Bluetooth / Agen ============ */
async function startCam(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:true});
    $('sheet-body').innerHTML=`<video autoplay playsinline style="width:100%;border-radius:26px"></video>`;
    $('sheet-body').querySelector('video').srcObject=s;
  }catch(e){alert('Kamera nicht verfügbar: '+e.message);}
}
async function scanBT(){
  const l=$('bt-list');
  if(!navigator.bluetooth){l.innerHTML=`<div class="row">Nicht verfügbar<small>Bitte Chrome auf Android verwenden.</small></div>`;return;}
  try{
    const d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['battery_service','device_information']});
    l.innerHTML=`<div class="row">${d.name||'Unbekanntes Gerät'}<small>${d.id}</small></div>`;
    d.addEventListener('gattserverdisconnected',()=>l.insertAdjacentHTML('beforeend',`<div class="row">Getrennt</div>`));
    await d.gatt.connect();
    l.insertAdjacentHTML('beforeend',`<div class="row">Verbunden<small>Bereit</small></div>`);
  }catch(e){l.innerHTML=`<div class="row">Abgebrochen<small>${e.message}</small></div>`;}
}
function askAgent(){
  const i=$('ain'),t=i.value.trim();if(!t)return;
  const c=$('chat');
  c.insertAdjacentHTML('beforeend',`<div class="bubble me">${t.replace(/[<>&]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]))}</div>`);
  i.value='';
  setTimeout(()=>c.insertAdjacentHTML('beforeend',`<div class="bubble ai">Demo: Hier wird später dein KI-Modell angebunden.</div>`),400);
}

/* ============ Start ============ */
if(!S.setup){renderSetup();$('setup').classList.remove('hide');$('lock').classList.add('hide');}
else{$('wall').className=WPS[S.wp];lockScreen(true);renderHome();}
tick();
</script>
</body>
</html>
