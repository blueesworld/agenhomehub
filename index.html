<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Agen Home Hub</title>
<style>
*{-webkit-box-sizing:border-box;box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:rgba(0,0,0,0)}
html,body{width:100%;height:100%;overflow:hidden;background:#000;position:fixed;left:0;top:0;right:0;bottom:0}
body{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.light{color:#111}
input,textarea,select{-webkit-user-select:text;user-select:text;font-family:inherit;color:#fff;outline:none;-webkit-appearance:none;appearance:none;background:none}
body.light input,body.light textarea,body.light select{color:#111}
select option{color:#000}
textarea{resize:none}
.hide{display:none!important}
#stage{position:absolute;left:50%;top:50%;overflow:hidden;background:#000}
#wall{position:absolute;left:0;top:0;width:100%;height:100%}
#wallimg{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:none}
.wp0{background:radial-gradient(circle at 75% 0%,#f0b68a 0%,rgba(240,182,138,0) 60%),radial-gradient(circle at 0% 100%,#c97b55 0%,rgba(201,123,85,0) 70%),linear-gradient(#b5764f,#6e4130)}
.wp1{background:radial-gradient(circle at 80% 0%,#4f8bff 0%,rgba(79,139,255,0) 55%),radial-gradient(circle at 10% 100%,#1b2262 0%,rgba(27,34,98,0) 70%),linear-gradient(#1c2352,#070916)}
.wp2{background:radial-gradient(circle at 20% 0%,#ff9d74 0%,rgba(255,157,116,0) 55%),radial-gradient(circle at 100% 100%,#b24d86 0%,rgba(178,77,134,0) 60%),linear-gradient(#2b1a33,#120a16)}
.wp3{background:linear-gradient(#e6ebf5,#8e9bb6)}
#dim{position:absolute;left:0;top:0;width:100%;height:100%;background:#000;opacity:0;pointer-events:none;z-index:80}

.glass{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);box-shadow:0 10px 28px rgba(0,0,0,.25);border-radius:28px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
body.light .glass{background:rgba(255,255,255,.7);border-color:rgba(255,255,255,.9)}
.glass.dark{background:rgba(16,20,34,.78);border-color:rgba(255,255,255,.18)}
.acc{background:#0a84ff;color:#fff}

.pill{display:inline-block;border:0;border-radius:99px;color:#fff;font-size:17px;font-weight:600;padding:12px 22px;background:rgba(255,255,255,.28);cursor:pointer;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.2)}
body.light .pill{color:#111}
.pill.blue{background:#0a84ff;color:#fff}
.pill:disabled{opacity:.5}
.ibtn{border:0;background:none;color:inherit;cursor:pointer;padding:6px}
.round{width:52px;height:52px;border-radius:26px;border:0;background:rgba(255,255,255,.25);color:#fff;cursor:pointer;display:inline-block;text-align:center;line-height:52px;font-size:26px}
body.light .round{color:#111}
.sw{display:inline-block;width:34px;height:34px;border-radius:17px;border:2px solid rgba(255,255,255,.5);cursor:pointer;margin-left:6px}
.switch{display:inline-block;width:52px;height:32px;border-radius:16px;background:rgba(120,120,128,.6);position:relative;cursor:pointer;vertical-align:middle}
.switch i{position:absolute;left:2px;top:2px;width:28px;height:28px;border-radius:14px;background:#fff;-webkit-transition:left .2s;transition:left .2s}
.switch.on{background:#34c759}
.switch.on i{left:22px}
.field{width:100%;padding:13px 15px;border-radius:14px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.16);font-size:17px}
body.light .field{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.15)}
.field::-webkit-input-placeholder{color:rgba(255,255,255,.6)}
.addrow{margin-bottom:14px}
.addrow:after{content:"";display:block;clear:both}
.addrow .field{display:block;width:100%;margin-bottom:8px}
.addrow .pill{display:block;width:100%}
.row{padding:14px 16px;border-radius:18px;margin-bottom:10px;background:rgba(255,255,255,.14);font-size:17px}
.row:after{content:"";display:block;clear:both}
.row .r{float:right}
.row small{display:block;font-size:13px;color:rgba(255,255,255,.7);margin-top:3px}
body.light .row small{color:rgba(0,0,0,.55)}
.rcard{padding:16px;margin-bottom:12px;border-radius:24px}
.note{font-size:14px;color:rgba(255,255,255,.72);margin:10px 4px;line-height:1.45}
body.light .note{color:rgba(0,0,0,.55)}
.sec{font-size:13px;color:rgba(255,255,255,.7);text-transform:uppercase;margin:18px 4px 8px}
.big{font-size:96px;font-weight:200;text-align:center;letter-spacing:-3px;margin:10px 0}
.seg{margin-bottom:14px;padding:4px;border-radius:16px;background:rgba(255,255,255,.14);white-space:nowrap}
.seg button{width:32%;border:0;background:none;color:inherit;padding:10px 0;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
.seg button.on{background:rgba(255,255,255,.35)}
.tabs{margin-bottom:14px;white-space:nowrap}
.tabs button{width:24%;border:0;background:rgba(255,255,255,.12);color:inherit;padding:10px 0;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
.tabs button.on{background:rgba(255,255,255,.35)}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:#0a84ff}
.lvl{display:inline-block;width:18px;height:18px;border-radius:9px;background:rgba(255,255,255,.3);margin:0 3px}
.lvl.on{background:#0a84ff}
.chk{display:inline-block;width:26px;height:26px;border-radius:13px;border:2px solid rgba(255,255,255,.6);text-align:center;line-height:22px;font-size:16px;font-weight:700;margin-right:10px;vertical-align:middle}
.chk.on{background:#0a84ff;border-color:#0a84ff}
.bubble{max-width:80%;padding:11px 14px;border-radius:18px;margin-bottom:8px;font-size:16px;line-height:1.35}
.bubble.me{margin-left:auto;background:#0a84ff}
.bubble.ai{background:rgba(255,255,255,.2)}
.wp-row{margin:10px 0}
.wp-pick{display:inline-block;width:56px;height:56px;border-radius:28px;border:3px solid transparent;margin:0 6px;cursor:pointer;vertical-align:middle}
.wp-pick.sel{border-color:#fff}
.wpt{display:inline-block;width:34px;height:34px;border-radius:17px;border:2px solid transparent;margin-left:6px;cursor:pointer;vertical-align:middle}
.wpt.sel{border-color:#fff}
.dots{text-align:center;margin:12px 0}
.dots i{display:inline-block;width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.35);margin:0 4px}
.dots i.on{background:#fff;width:20px}
.cgrid{text-align:center}
.cbtn{display:inline-block;width:22%;height:64px;margin:6px 1%;border:0;border-radius:20px;color:#fff;font-size:24px;background:rgba(255,255,255,.22);cursor:pointer;line-height:64px;text-align:center;vertical-align:top}
.cbtn.op{background:#0a84ff}
body.light .cbtn{color:#111}
.art{width:170px;height:170px;margin:10px auto 18px;border-radius:40px;background:linear-gradient(#ff375f,#bf2b5a);text-align:center;line-height:170px}
.preview{width:100%;border-radius:22px;margin-top:12px;display:none}

/* Seiten, Widgets, Apps */
#pages{position:absolute;left:0;top:0;width:100%;height:100%;z-index:4}
.pg{position:absolute;left:0;top:0;width:100%;height:100%;-webkit-transform:translate3d(0,0,0);transform:translate3d(0,0,0)}
.anim .pg{-webkit-transition:-webkit-transform .35s ease-out;transition:transform .35s ease-out}
.wbox{position:absolute;padding:16px;overflow:hidden}
.wbox .wb{position:absolute;left:16px;top:16px;right:16px;bottom:16px;overflow:hidden}
.wbox .lbl{font-size:17px;font-weight:600}
.wbox .lbl small{display:block;font-size:13px;color:rgba(255,255,255,.7);font-weight:500;margin-top:2px}
.tnum{font-size:90px;font-weight:200;text-align:center;letter-spacing:-3px;line-height:1}
.dig{font-size:58px;font-weight:300;line-height:1}
.dtxt{font-size:16px;color:rgba(255,255,255,.7);margin-top:6px}
.wxt{font-size:52px;font-weight:200;line-height:1}
.wdel{position:absolute;left:-8px;top:-8px;width:30px;height:30px;border-radius:15px;background:rgba(40,40,44,.95);border:2px solid #fff;text-align:center;display:none;z-index:6}
.wres{position:absolute;right:4px;bottom:4px;width:26px;height:26px;border-radius:13px;background:rgba(255,255,255,.5);display:none;z-index:6}
body.edit .wdel,body.edit .adel,body.edit .wres{display:block}
.appt{position:absolute;text-align:center;overflow:visible}
.appt .ic{margin:0 auto;border-radius:22px;text-align:center;box-shadow:0 8px 16px rgba(0,0,0,.28)}
.appt .nm{font-size:14px;font-weight:500;margin-top:7px;white-space:nowrap;overflow:hidden;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.adel{position:absolute;left:50%;top:-8px;margin-left:-42px;width:28px;height:28px;border-radius:14px;background:rgba(40,40,44,.95);border:2px solid #fff;text-align:center;display:none;z-index:6}
.dockbox{position:absolute;left:50%;bottom:14px;margin-left:-190px;width:380px;height:96px;padding:12px;z-index:20;text-align:center}
.dockbox .appt{position:relative;display:inline-block;width:auto;height:auto;margin:0 6px}
.dockbox .nm{display:none}
#pdots{position:absolute;left:0;bottom:126px;width:100%;text-align:center;z-index:5}
#pdots i{display:inline-block;width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.35);margin:0 4px}
#pdots i.on{background:#fff;width:20px}
body.edit .adel{display:block}
#editbar{position:absolute;left:50%;top:52px;margin-left:-190px;width:380px;padding:10px;text-align:center;z-index:45}
#editbar .pill{margin:0 4px}

#status{position:absolute;left:44px;right:44px;top:12px;height:30px;font-size:18px;font-weight:600;z-index:5}
#status span{position:absolute;top:0}
#status .l{left:0}
#status .r{right:0;cursor:pointer;padding:0 6px;font-size:16px}

/* Sperren */
#lock{position:absolute;left:0;top:0;width:100%;height:100%;z-index:60;text-align:center;padding-top:110px}
#lkT{font-size:180px;font-weight:300;letter-spacing:-6px;line-height:1;text-shadow:0 2px 20px rgba(0,0,0,.25)}
#lkD{font-size:26px;font-weight:500;margin-top:8px;text-shadow:0 1px 8px rgba(0,0,0,.25)}
#lkH{position:absolute;left:0;bottom:50px;width:100%;text-align:center;font-size:16px;color:rgba(255,255,255,.85)}
#lkH i{display:block;margin:0 auto 12px;width:46px;height:5px;border-radius:3px;background:rgba(255,255,255,.8)}

/* Kontrollzentrum */
#cc{position:absolute;left:0;top:0;width:100%;height:100%;z-index:70;background:rgba(0,0,0,.2);opacity:0;visibility:hidden;-webkit-transition:opacity .3s,visibility .3s;transition:opacity .3s,visibility .3s}
#cc.open{opacity:1;visibility:visible}
#ccp{position:absolute;right:14px;top:14px;width:420px;padding:16px;border-radius:32px;-webkit-transform:translateY(-120%);transform:translateY(-120%);-webkit-transition:-webkit-transform .4s ease-out;transition:transform .4s ease-out}
#cc.open #ccp{-webkit-transform:none;transform:none}
.cct{display:inline-block;width:47%;margin:0 1% 10px;padding:16px 10px;border-radius:22px;background:rgba(255,255,255,.2);font-size:16px;font-weight:600;text-align:center;cursor:pointer}
.cct.on{background:#0a84ff}
.ccs{padding:12px 16px;margin-bottom:10px;border-radius:22px;background:rgba(255,255,255,.2);font-size:15px;font-weight:600}
.ccs input{width:100%;margin-top:6px}

/* App-Fenster */
#sheet{position:absolute;left:14px;top:14px;right:14px;bottom:14px;z-index:40;border-radius:36px;opacity:0;visibility:hidden;-webkit-transform:scale(.92);transform:scale(.92);-webkit-transition:opacity .3s,visibility .3s,-webkit-transform .4s ease-out;transition:opacity .3s,visibility .3s,transform .4s ease-out;overflow:hidden}
#sheet.open{opacity:1;visibility:visible;-webkit-transform:none;transform:none}
#shT{font-size:24px;font-weight:700;padding:16px 20px;display:inline-block}
#shX{position:absolute;right:16px;top:14px;width:42px;height:42px;border-radius:21px;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:18px;cursor:pointer}
#shB{position:absolute;left:0;top:70px;right:0;bottom:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 22px 40px}
#shB.frame{overflow:hidden;padding:0}
#shB iframe{width:100%;height:100%;border:0;background:#111}

/* Einrichtung */
#setup{position:absolute;left:0;top:0;width:100%;height:100%;z-index:90;text-align:center;padding-top:60px}
#suc{display:inline-block;width:620px;padding:34px;border-radius:36px;text-align:center}
#suc h1{font-size:30px;font-weight:700;margin-bottom:10px}
#suc p{font-size:17px;color:rgba(255,255,255,.75);margin:10px 0;line-height:1.4}
body.light #suc p{color:rgba(0,0,0,.6)}

#toast{position:absolute;left:50%;top:-90px;margin-left:-200px;width:400px;padding:12px 18px;border-radius:99px;text-align:center;font-size:16px;font-weight:600;z-index:95;-webkit-transition:top .35s ease-out;transition:top .35s ease-out}
#toast.show{top:18px}
</style>
</head>
<body>
<div id="stage">
 <div id="wall" class="wp0"></div>
 <img id="wallimg" alt="">
 <div id="pages"></div>
 <div id="pdots"></div>
 <div id="status" class="hide"><span class="l" id="sbt"></span><span class="r" data-act="openCC">Kontrollzentrum</span></div>
 <div id="dock" class="dockbox glass hide"></div>
 <div id="editbar" class="glass hide">
  <button class="pill" data-act="addWidget">+ Widget</button>
  <button class="pill" data-act="openStore">+ App</button>
  <button class="pill blue" data-act="doneEdit">Fertig</button>
 </div>
 <div id="lock" class="hide">
  <div id="lkT"></div>
  <div id="lkD"></div>
  <div id="lkH"><i></i>Nach oben wischen zum Öffnen</div>
 </div>
 <div id="cc"><div class="glass dark" id="ccp"></div></div>
 <div id="sheet" class="glass dark">
  <div id="shT"></div>
  <button id="shX" data-act="closeApp">✕</button>
  <div id="shB"></div>
 </div>
 <div id="setup" class="hide"><div class="glass dark" id="suc"></div></div>
 <div id="toast" class="glass dark"></div>
 <div id="dim"></div>
 <style id="dyn"></style>
</div>

<script>
/* ============ Grundfunktionen ============ */
var $=function(id){return document.getElementById(id);};
function pad(n){n=String(n);return n.length<2?'0'+n:n;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function uid(){return 'i'+Date.now().toString(36)+Math.floor(Math.random()*100000).toString(36);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function setTf(el,v){el.style.webkitTransform=v;el.style.transform=v;}
function hasCls(n,c){return !!(n&&n.className&&typeof n.className==='string'&&(' '+n.className+' ').indexOf(' '+c+' ')>-1);}
function addCls(n,c){if(n&&!hasCls(n,c))n.className=(n.className?n.className+' ':'')+c;}
function delCls(n,c){if(n&&n.className)n.className=(' '+n.className+' ').split(' '+c+' ').join(' ').replace(/^\s+|\s+$/g,'');}
function upBy(n,test){while(n&&n.nodeType===1){if(test(n))return n;n=n.parentNode;}return null;}
function dayKey(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
var WDN=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
var MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function fmtTime(d){
 if(S.h24) return pad(d.getHours())+':'+pad(d.getMinutes());
 var h=d.getHours()%12; if(h===0)h=12; return h+':'+pad(d.getMinutes());
}
function fmtDate(d){return WDN[d.getDay()]+', '+d.getDate()+'. '+MON[d.getMonth()];}
function fmtMs(ms){var s=Math.floor(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60);}
function nf(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function toast(msg){
 var t=$('toast'); t.innerHTML=esc(msg); addCls(t,'show');
 clearTimeout(toast.h); toast.h=setTimeout(function(){delCls(t,'show');},2400);
}

/* ============ Icons (SVG-Linien) ============ */
var ICONS={
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 cloud:'<path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.5 3.5 0 0 0 7 18z"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="3.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 check:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12.5l3 3 5-6"/>',
 note:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/>',
 calc:'<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7.5h8M8 12h1M12 12h1M16 12h1M8 16h1M12 16h1M16 16h1"/>',
 photo:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="9.5" r="1.8"/><path d="M4 18l5.5-5.5 4 4 2.5-2.5L20 18"/>',
 music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
 bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1V17h5v-1c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
 therm:'<path d="M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z"/>',
 cam:'<rect x="3" y="7" width="13" height="11" rx="2.5"/><path d="M16 10.5l5-3v9l-5-3"/>',
 wave:'<path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/>',
 bt:'<path d="M7 7l10 10-5 5V2l5 5L7 17"/>',
 spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
 heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
 cart:'<path d="M3 4h2l2.4 11h10.2L20 7H7"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/>',
 bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 minus:'<path d="M5 12h14"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 prev:'<path d="M19 4l-10 8 10 8zM5 4h2v16H5z"/>',
 next:'<path d="M5 4l10 8-10 8zM17 4h2v16h-2z"/>',
 play:'<path d="M7 4l13 8-13 8z"/>',
 pause:'<path d="M7 4h4v16H7zM13 4h4v16h-4z"/>',
 wifi:'<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/>',
 moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
 plane:'<path d="M3 13l18-7-7 18-2-7z"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
};
var FILLED={play:1,pause:1,prev:1,next:1};
function ic(n,s){
 s=s||24;
 var f=FILLED[n]?'#fff':'none';
 return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="'+f+'" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[n]||'')+'</svg>';
}

/* ============ Daten ============ */
var ACC=['#0a84ff','#bf5af2','#ff375f','#30d158','#ff9f0a'];
var WPS=['wp0','wp1','wp2','wp3'];

function fit(){
 PORT=window.innerHeight>window.innerWidth;
 W=PORT?768:1024; H=PORT?1024:768;
 COLS=PORT?4:6;
 CW=(W-PADX*2)/COLS;
 WROWS=Math.max(2,Math.floor((H-TOPW-150)/CH));
 AROWS=Math.max(2,Math.floor((H-TOPA-150)/ROWH));
 APG=COLS*AROWS;
 SC=Math.min(window.innerWidth/W,window.innerHeight/H);
 var st=$('stage');
 st.style.width=W+'px'; st.style.height=H+'px';
 setTf(st,'translate(-50%,-50%) scale('+SC+')');
}
function findSlot(w,h,list,cols){
 for(var y=0;y<40;y++){
  for(var x=0;x+w<=cols;x++){
   var ok=true;
   for(var i=0;i<list.length;i++){
    var o=list[i];
    if(x<o.x+o.w && x+w>o.x && y<o.y+o.h && y+h>o.y){ok=false;break;}
   }
   if(ok) return {x:x,y:y};
  }
 }
 return {x:0,y:0};
}
function buildLayout(cols,types){
 var list=[];
 for(var i=0;i<types.length;i++){
  var d=WID[types[i]]; if(!d) continue;
  var w=Math.min(d.w,cols), h=d.h;
  var sl=findSlot(w,h,list,cols);
  list.push({id:uid(),t:types[i],x:sl.x,y:sl.y,w:w,h:h});
 }
 return list;
}
function ensureLayout(){

/* ============ Ton ============ */
function loadVoices(){
 if(!window.speechSynthesis||!speechSynthesis.getVoices) return;
 var vs=speechSynthesis.getVoices()||[];
 VOICE=null;
 for(var i=0;i<vs.length;i++){ if(/^de/i.test(vs[i].lang)){VOICE=vs[i];break;} }
}
if(window.speechSynthesis){
 loadVoices();
 try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}
}
function say(text){
 if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){
  toast('Ansage auf diesem Gerät nicht verfügbar'); return false;
 }
 try{
  speechSynthesis.cancel();
  speechSynthesis.resume();
 }catch(e){}
 UTT=new SpeechSynthesisUtterance(text);
 UTT.lang='de-DE';
 if(VOICE) UTT.voice=VOICE;
 UTT.rate=0.92; UTT.pitch=1; UTT.volume=1;
 UTT.onerror=function(){toast('Ansage fehlgeschlagen');};
 setTimeout(function(){ try{speechSynthesis.speak(UTT);}catch(e){toast('Ansage fehlgeschlagen');} },80);
 return true;
}
function beep(){
 try{
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  var ctx=new AC();
  var o=ctx.createOscillator(), g=ctx.createGain();
  o.frequency.value=880; g.gain.value=0.25;
  o.connect(g); g.connect(ctx.destination);
  o.start(0); o.stop(ctx.currentTime+0.45);
 }catch(e){}
}

function calcKey(k){
 if(k==='C') CALC='';
 else if(k==='⌫') CALC=CALC.slice(0,-1);
 else if(k==='='){
  try{
   var x=CALC.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');
   if(!/^[0-9+\-*\/(). \/]*$/.test(x)) throw new Error('bad');
   var r=Function('return ('+x+');')();
   CALC=isFinite(r)?String(+r.toFixed(10)):'Fehler';
  }catch(e){CALC='Fehler';}
 } else {
  if(CALC==='Fehler') CALC='';
  CALC+=k;
 }
 renderSheet(false);
}

function agenSend(){
 var inp=$('ain'); if(!inp) return;
 var q=inp.value.replace(/^\s+|\s+$/g,''); if(!q) return;
 inp.value='';
 S.chat.push({r:'me',t:q}); S.chat=S.chat.slice(-40); save(); renderSheet(false);
 respond(q,function(a){
  S.chat.push({r:'ai',t:a}); S.chat=S.chat.slice(-40); save();
  if(/^sag\s+/i.test(q)) say(q.replace(/^sag\s+/i,''));
  renderSheet(false); renderWidgets();
 });
}
function respond(q,done){
 var l=q.toLowerCase();
 if(/^sag\s+/.test(l)) return done('Ich sage: '+q.replace(/^sag\s+/i,''));
 if(/licht.*(aus|off)|alles aus/.test(l)){S.rooms.forEach(function(r){r.on=false;});save();return done('Alle Lichter sind aus.');}
 if(/licht.*(an|ein|on)/.test(l)){S.rooms.forEach(function(r){r.on=true;});save();return done('Alle Lichter sind an.');}
 var m=l.match(/stufe\s*([1-5])/);
 if(m){S.heat=+m[1];save();return done('Heizung auf Stufe '+S.heat+'.');}
 if(/wie spät|uhrzeit|wie viel uhr/.test(l)) return done('Es ist '+fmtTime(new Date())+' Uhr.');
 if(/wetter/.test(l)){var w=WX[S.city]||WX.Wildeshausen;return done(S.city+': '+w.t+' Grad, '+w.c.toLowerCase()+' (Beispieldaten).');}
 if(S.agenUrl){
  var xhr=new XMLHttpRequest();
  xhr.open('POST',S.agenUrl,true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.onreadystatechange=function(){
   if(xhr.readyState!==4) return;
   var txt=xhr.responseText||'';

  };
  xhr.onerror=function(){done('Der Endpunkt antwortet nicht.');};
  xhr.send(JSON.stringify({message:q}));
  return;
 }
 done('Ich kann Licht, Heizung, Uhrzeit, Wetter und Ansagen (sag …). Für freie Fragen trage einen Endpunkt in den Einstellungen ein.');
}

/* ============ Dateien, Fotos, Sicherung ============ */
function compressImg(dataUrl,max,cb){
 var img=new Image();
 img.onload=function(){
  var s=Math.min(1,max/Math.max(img.width,img.height));
  var c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  cb(c.toDataURL('image/jpeg',0.8));
 };
 img.onerror=function(){toast('Bild konnte nicht gelesen werden');};
 img.src=dataUrl;
}
function readFile(file,cb){
 if(!file) return;
 var r=new FileReader();
 r.onload=function(){cb(r.result);};
 r.readAsDataURL(file);
}
function setPhoto(file){
 readFile(file,function(d){
  compressImg(d,1280,function(out){
   S.photo=out; save(); applyTheme(); refreshAll(); toast('Hintergrund gesetzt');
  });
 });
}
function camPhoto(file){
 readFile(file,function(d){
  compressImg(d,900,function(out){
   S.lastCam=out; save(); renderSheet(false); toast('Foto aufgenommen');
  });
 });
}
function exportData(){
 try{
  var blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='agen-sicherung.json';
  document.body.appendChild(a); a.click();
 }catch(e){toast('Export nicht möglich');}
}
function importData(file){
 var r=new FileReader();
 r.onload=function(){
  try{
   var j=JSON.parse(r.result);
   S=clone(DEF); for(var k in j){ if(j.hasOwnProperty(k)) S[k]=j[k]; }
   save(); applyTheme(); renderAll(); toast('Sicherung geladen');
  }catch(e){toast('Datei ungültig');}
 };
 r.readAsText(file);
}
function installFile(file){
 var r=new FileReader();
 r.onload=function(){
  try{addCustom(JSON.parse(r.result));}catch(e){toast('Datei ungültig');}
 };
 r.readAsText(file);
}

document.addEventListener('input',function(e){
 var t=e.target, k=t.getAttribute('data-in'); if(!k) return;
 var v=t.value;
 if(k==='suname'){SU.name=v;return;}
 if(k==='bright'){S.bright=+v;applyTheme();}
 else if(k==='vol'){S.vol=+v;MUS.a.volume=S.vol/100;}
 else if(k==='room'){var r=S.rooms[+t.getAttribute('data-i')]; if(r) r.b=+v;}
 else if(k==='note'){S.note=v;}
 else if(k==='name'){S.name=v;}
 else if(k==='agen'){S.agenUrl=v.replace(/^\s+|\s+$/g,'');}
 else if(k==='blur'){S.blur=+v;applyTheme();}
 else if(k==='icon'){S.is=+v;}
 else if(k==='city'){S.city=v;}
 save();
 if(k==='icon'||k==='room') {}
});
document.addEventListener('change',function(e){
 var t=e.target;
 var f=t.getAttribute('data-file');
 if(f){
  var files=t.files; if(!files||!files.length) return;
  if(f==='music'){for(var i=0;i<files.length;i++) MUS.list.push({name:files[i].name,url:URL.createObjectURL(files[i])});refreshAll();}
  else if(f==='photo') setPhoto(files[0]);
  else if(f==='cam') camPhoto(files[0]);
  else if(f==='installFile') installFile(files[0]);
  else if(f==='import') importData(files[0]);
  try{t.value='';}catch(err){}
  return;
 }
 var k=t.getAttribute('data-in');
 if(k==='city'){S.city=t.value;save();renderAll();}
 if(k==='name'){S.name=t.value.replace(/^\s+|\s+$/g,'')||S.name;save();refreshAll();}
 if(k==='icon'){S.is=+t.value;save();renderAll();renderSheet(false);}
 if(k==='bright'||k==='vol'){save();}
});
document.addEventListener('keydown',function(e){
 var t=e.target;
 if(e.key==='Enter'&&t&&t.getAttribute&&t.getAttribute('data-enter')){
  var fn=t.getAttribute('data-enter');
  if(fn==='listAdd') ACT.listAdd({key:t.getAttribute('data-key')});
  else if(fn==='evAdd') ACT.evAdd();
  else if(fn==='roomAdd') ACT.roomAdd();
  else if(fn==='stepsAdd') ACT.stepsAdd();
  else if(fn==='sleepAdd') ACT.sleepAdd();
  else if(fn==='announce') announce();
  else if(fn==='agenSend') agenSend();
  else if(fn==='installLink') ACT.installLink();
  return;
 }
 if(e.key==='Escape'){closeApp();toggleCC(false);exitEdit();}
});

 }
 if(LOCKED){
  if(upBy(tgt,function(n){return n.id==='lock';})) unlock();
  return;
 }
 var act=upBy(tgt,function(n){return n.getAttribute&&n.getAttribute('data-act');});
 if(act){
  var f=ACT[act.getAttribute('data-act')];
  if(f) f(dataOf(act));
  return;
 }
 if(upBy(tgt,function(n){return n.id==='cc';})&&!upBy(tgt,function(n){return n.id==='ccp';})){toggleCC(false);return;}
 if(upBy(tgt,function(n){return n.id==='ccp';})) return;
 if(upBy(tgt,function(n){return n.id==='sheet';})) return;
 var app=upBy(tgt,function(n){return hasCls(n,'appt')&&n.getAttribute('data-app');});
 if(app){ if(!EDIT) openApp(app.getAttribute('data-app')); return; }
 var wbox=upBy(tgt,function(n){return hasCls(n,'wbox');});
 if(wbox){
  if(!EDIT){
   var wd=null, l=curLayout();
   for(var i=0;i<l.length;i++) if(l[i].id===wbox.getAttribute('data-wid')) wd=l[i];
   if(wd&&WID[wd.t]&&WID[wd.t].app) openApp(WID[wd.t].app);
  }
  return;
 }
 if(EDIT&&!upBy(tgt,function(n){return n.id==='editbar';})) exitEdit();
}
function dataOf(el){
 var d={};
 for(var i=0;i<el.attributes.length;i++){
  var a=el.attributes[i];
  if(a.name.indexOf('data-')===0) d[a.name.slice(5).replace(/-([a-z])/g,function(m,c){return c.toUpperCase();})]=a.value;
 }
 return d;
}
document.addEventListener('click',onClick,false);

/* ============ Ziehen, Wischen, Halten (Touch + Maus) ============ */
var HAS_TOUCH=('ontouchstart' in window);
function gp(e){
 var t=null;
 if(e.touches&&e.touches.length) t=e.touches[0];
 else if(e.changedTouches&&e.changedTouches.length) t=e.changedTouches[0];
 else t=e;
 return {x:t.clientX,y:t.clientY};
}
function isEditTarget(tgt){return !!upBy(tgt,function(n){return n.id==='editbar';});}
function onDown(e){
 var p=gp(e);
 ST={x:p.x,y:p.y};
 CLICK_BLOCK=false;
 if(SETUP) return;
 if(LOCKED){ LOCK_Y=p.y; return; }
 var tgt=e.target;
 if(isEditTarget(tgt)) return;
 if(upBy(tgt,function(n){return n.getAttribute&&n.getAttribute('data-act');})) return;
 var wbox=upBy(tgt,function(n){return hasCls(n,'wbox');});
 var app=upBy(tgt,function(n){return hasCls(n,'appt')&&n.getAttribute('data-app');});
 var res=upBy(tgt,function(n){return hasCls(n,'wres');});
 var inPage=upBy(tgt,function(n){return hasCls(n,'pg');});
 var isDockOrBar=upBy(tgt,function(n){return n.id==='dock'||n.id==='pdots';});
 if(EDIT){
  if(res&&wbox){
   var wd=findW(wbox);
   if(wd) DRG={mode:'res',el:wbox,wd:wd,sx:p.x,sy:p.y,moved:false,nw:wd.w,nh:wd.h};
  } else if(wbox){
   var wd2=findW(wbox);
   if(wd2) DRG={mode:'move',el:wbox,wd:wd2,sx:p.x,sy:p.y,moved:false,dx:0,dy:0};
  } else if(app){
   DRG={mode:'app',id:app.getAttribute('data-app'),el:app,sx:p.x,sy:p.y,moved:false};
  } else if(inPage){
   SWP={sx:p.x,dx:0,moved:false};
  }
  return;
 }
 if(wbox||app){
  PRS=setTimeout(function(){PRS=null;CLICK_BLOCK=true;enterEdit();},500);
  return;
 }
 if(inPage&&!isDockOrBar){
  SWP={sx:p.x,dx:0,moved:false};
 }
}
function findW(el){
 var id=el.getAttribute('data-wid'), l=curLayout();
 for(var i=0;i<l.length;i++) if(l[i].id===id) return l[i];
 return null;
}
function onMove(e){
 var p=gp(e);
 if(PRS && (Math.abs(p.x-ST.x)+Math.abs(p.y-ST.y))>10){clearTimeout(PRS);PRS=null;}
 if(LOCKED||SETUP) return;
 if(DRG){
  var dx=(p.x-DRG.sx)/SC, dy=(p.y-DRG.sy)/SC;
  if(!DRG.moved && Math.abs(dx)+Math.abs(dy)<5) return;
  DRG.moved=true; CLICK_BLOCK=true;
  if(e.cancelable) e.preventDefault();
  if(DRG.mode==='move'){
   DRG.dx=dx; DRG.dy=dy;
   DRG.el.style.zIndex='30';
   setTf(DRG.el,'translate('+dx+'px,'+dy+'px)');
  } else if(DRG.mode==='res'){
   var wd=DRG.wd;
   DRG.nw=clamp(Math.round(wd.w+dx/CW),1,curCols()-wd.x);
   DRG.nh=clamp(Math.round(wd.h+dy/CH),1,WROWS-wd.y);
   DRG.el.style.width=(DRG.nw*CW-GAP)+'px';
   DRG.el.style.height=(DRG.nh*CH-GAP)+'px';
  } else if(DRG.mode==='app'){
   DRG.el.style.zIndex='30';
   setTf(DRG.el,'translate('+dx+'px,'+dy+'px) scale(1.08)');
   var under=document.elementFromPoint(p.x,p.y);
   var tg=upBy(under,function(n){return hasCls(n,'appt')&&n.getAttribute('data-app');});
   if(tg && tg.getAttribute('data-app')!==DRG.id){
    var a1=S.apps.indexOf(DRG.id), a2=S.apps.indexOf(tg.getAttribute('data-app'));
    if(a1>-1&&a2>-1){
     S.apps.splice(a1,1); S.apps.splice(a2,0,DRG.id);
     DRG.dirty=true; DRG.sx=p.x; DRG.sy=p.y;
     renderAll();
     DRG.el=null;
     DRG=null; return;
    }
   }
  }
  return;
 }
 if(SWP){
  var sdx=p.x-SWP.sx;
  if(!SWP.moved && Math.abs(sdx)<8) return;
  SWP.moved=true; CLICK_BLOCK=true;
  if(e.cancelable) e.preventDefault();
  SWP.dx=sdx;
  layoutPages(sdx/SC);
 }
}
function onUp(e){
 if(PRS){clearTimeout(PRS);PRS=null;}
 var p=gp(e);
 var dx=p.x-ST.x, dy=p.y-ST.y;
 if(LOCKED){
  if(dy<-50 && Math.abs(dy)>Math.abs(dx)) unlock();
  return;
 }
 if(SETUP){return;}
 if(!EDIT && !CC_OPEN && ST.y<60 && dy>50 && ST.x>innerWidth/2){ openCC(); DRG=null; SWP=null; return; }
 if(SWP){
  var moved=SWP.moved;
  var pages=$('pages').children.length;
  var pd=SWP.dx/SC;
  var next=PI;
  if(pd<-W*0.2 && PI<pages-1) next=PI+1;
  else if(pd>W*0.2 && PI>0) next=PI-1;
  PI=next;
  SWP=null;
  layoutPages(0);
  if(moved) CLICK_BLOCK=true;
  return;
 }
 if(DRG){
  var D=DRG; DRG=null;
  if(D.mode==='move'&&D.moved){
   var wd=D.wd, l=curLayout(), cols=curCols();
   var nx=clamp(Math.round(wd.x+D.dx/CW),0,cols-wd.w);
   var ny=clamp(Math.round(wd.y+D.dy/CH),0,Math.max(0,WROWS-wd.h));
   if(!collides(l,wd,nx,ny,wd.w,wd.h)){wd.x=nx;wd.y=ny;}
   save();
  } else if(D.mode==='res'&&D.moved&&D.nw){
   var w2=D.wd, l2=curLayout();
   if(!collides(l2,w2,w2.x,w2.y,D.nw,D.nh)){w2.w=D.nw;w2.h=D.nh;}
   save();
  } else if(D.mode==='app'&&D.dirty){
   save();
  }
  renderAll();
  if(D.moved) CLICK_BLOCK=true;
 }
}
function collides(list,wd,x,y,w,h){
 for(var i=0;i<list.length;i++){
  var o=list[i];
  if(o.id===wd.id) continue;
  if(x<o.x+o.w && x+w>o.x && y<o.y+o.h && y+h>o.y) return true;
 }
 return false;
}
if(HAS_TOUCH){
 document.addEventListener('touchstart',onDown,false);
 document.addEventListener('touchmove',onMove,false);
 document.addEventListener('touchend',onUp,false);
} else {
 document.addEventListener('mousedown',onDown,false);
 document.addEventListener('mousemove',onMove,false);
 document.addEventListener('mouseup',onUp,false);
}
document.addEventListener('contextmenu',function(e){e.preventDefault();},false);

/* ============ Uhr, Alarme, Timer ============ */
function tick(){
 var d=new Date();
 var h=d.getHours(), m=d.getMinutes(), s=d.getSeconds();
 var sbt=$('sbt'); if(sbt) sbt.innerHTML=fmtTime(d);
 var lkT=$('lkT'); if(lkT) lkT.innerHTML=pad(h)+':'+pad(m);
 var lkD=$('lkD'); if(lkD) lkD.innerHTML=fmtDate(d);
 var hh=document.getElementsByClassName('hh'), mh=document.getElementsByClassName('mh'), sh=document.getElementsByClassName('sh');
 var i;
 for(i=0;i<hh.length;i++) hh[i].setAttribute('transform','rotate('+((h%12)*30+m*0.5)+')');
 for(i=0;i<mh.length;i++) mh[i].setAttribute('transform','rotate('+(m*6+s*0.1)+')');
 for(i=0;i<sh.length;i++) sh[i].setAttribute('transform','rotate('+(s*6)+')');
 var dig=document.getElementsByClassName('dig');
 for(i=0;i<dig.length;i++) dig[i].innerHTML=fmtTime(d);
 var dd=document.getElementsByClassName('dtxt');
 for(i=0;i<dd.length;i++) dd[i].innerHTML=fmtDate(d);
 var tm=document.getElementsByClassName('tnum');
 var tmr=document.querySelector?document.querySelector('[data-role=tm]'):null;
 if(tmr) tmr.innerHTML=fmtMs(tmLeft());
 var swr=document.querySelector?document.querySelector('[data-role=sw]'):null;
 if(swr) swr.innerHTML=fmtMs(swMs());
 var key=pad(h)+':'+pad(m);
 if(s===0 && LAST_MIN!==key){
  LAST_MIN=key;
  for(var a=0;a<S.alarms.length;a++){
   if(S.alarms[a].on && S.alarms[a].t===key){
    beep(); toast('Wecker: '+(S.alarms[a].l||S.alarms[a].t));
    setTimeout(function(){say('Wecker. '+(S.alarms[a]?S.alarms[a].l:''));},600);
   }
  }
 }
 if(TM.end && Date.now()>=TM.end){
  TM={rem:TMDUR,end:0};
  beep(); toast('Timer abgelaufen'); say('Timer abgelaufen');
  if(CUR==='clock') renderSheet(false);
 }
}
setInterval(tick,1000);

/* ============ Start ============ */
fit();
MUS.a.volume=S.vol/100;
applyTheme();
window.addEventListener('resize',function(){fit();if(!LOCKED&&S.setup) renderAll();});
window.addEventListener('orientationchange',function(){setTimeout(function(){fit();if(!LOCKED&&S.setup) renderAll();},300);});
ensureLayout();
tick();
if(!S.setup){
 SETUP=true;
 $('lock').className='hide';
 renderSetup();
 $('setup').className='';
} else {
 showLock();
}
</script>
