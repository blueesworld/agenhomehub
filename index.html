<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Agen Home Hub</title>
<style>
  :root {
    --glass: rgba(255,255,255,0.18);
    --glass-strong: rgba(255,255,255,0.28);
    --glass-border: rgba(255,255,255,0.35);
    --text: #fff;
    --text-dim: rgba(255,255,255,0.7);
    --accent: #0A84FF;
    --radius: 28px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: #0b0d1a;
    user-select: none;
  }
  .wallpaper {
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(circle at 20% 15%, #ff7ab6 0%, transparent 45%),
      radial-gradient(circle at 85% 25%, #5ac8fa 0%, transparent 50%),
      radial-gradient(circle at 60% 90%, #ffd60a 0%, transparent 45%),
      radial-gradient(circle at 10% 85%, #7d5cff 0%, transparent 50%),
      linear-gradient(160deg, #1b1f3b, #0b0d1a);
    transition: background 0.6s ease;
  }
  /* Liquid-Glass Grundklasse */
  .glass {
    background: linear-gradient(135deg, rgba(255,255,255,0.32), rgba(255,255,255,0.08));
    backdrop-filter: blur(28px) saturate(190%);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    border: 1px solid var(--glass-border);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.55),
      inset 0 -1px 1px rgba(255,255,255,0.12),
      0 10px 30px rgba(0,0,0,0.25);
    border-radius: var(--radius);
  }
  .btn {
    border: none; cursor: pointer; color: var(--text); font: inherit;
    padding: 14px 22px; border-radius: 999px; font-weight: 600; font-size: 16px;
    background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0.12));
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.6), 0 6px 18px rgba(0,0,0,0.25);
    transition: transform 0.15s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn.primary { background: linear-gradient(135deg, #3d9bff, #0A84FF); }
  .hidden { display: none !important; }
  .screen { position: fixed; inset: 0; }

  /* ---------- SETUP ---------- */
  #setup { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 32px; text-align: center; z-index: 50; }
  #setup .card { width: min(440px, 100%); padding: 36px 28px; display: flex; flex-direction: column; gap: 18px; align-items: center; }
  .logo { width: 96px; height: 96px; border-radius: 26px; display:flex; align-items:center; justify-content:center; font-size: 46px;
    background: linear-gradient(135deg,#5ac8fa,#7d5cff); box-shadow: inset 0 2px 2px rgba(255,255,255,.6), 0 14px 30px rgba(0,0,0,.35); }
  #setup h1 { font-size: 30px; font-weight: 700; }
  #setup p { color: var(--text-dim); font-size: 16px; line-height: 1.45; }
  .field { width: 100%; padding: 16px 18px; border-radius: 18px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.14); color: #fff; font: inherit; font-size: 17px; outline: none; }
  .field::placeholder { color: rgba(255,255,255,0.55); }
  .dots { display: flex; gap: 8px; }
  .dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.3); }
  .dots span.on { background: #fff; }
  .wp-choices { display: flex; gap: 12px; }
  .wp-choice { width: 64px; height: 64px; border-radius: 18px; cursor: pointer; border: 2px solid transparent; }
  .wp-choice.sel { border-color: #fff; }

  /* ---------- HOME ---------- */
  #home { display: flex; flex-direction: column; padding: 14px 18px 110px; overflow-y: auto; }
  .statusbar { display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; padding: 4px 8px; }
  .widgets { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px 0; }
  .widget { padding: 18px; min-height: 130px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
  .widget.wide { grid-column: span 2; min-height: 110px; }
  .widget .big { font-size: 40px; font-weight: 300; }
  .widget .label { font-size: 13px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px 12px; justify-items: center; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; width: 76px; }
  .app .icon { width: 66px; height: 66px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 32px;
    background: linear-gradient(145deg, rgba(255,255,255,0.45), rgba(255,255,255,0.05));
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.35);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.7), 0 8px 18px rgba(0,0,0,.25);
    transition: transform .15s ease; }
  .app:active .icon { transform: scale(.92); }
  .app .name { font-size: 12px; text-shadow: 0 1px 3px rgba(0,0,0,.4); text-align: center; }
  .dock { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; padding: 12px 18px; border-radius: 34px; z-index: 20; }
  .dock .app .icon { width: 58px; height: 58px; font-size: 28px; }
  .dock .app .name { display: none; }

  /* ---------- CONTROL CENTER ---------- */
  #cc { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .3s ease; }
  #cc.open { opacity: 1; pointer-events: auto; }
  #cc .panel { position: absolute; top: 14px; right: 14px; width: min(380px, calc(100% - 28px)); padding: 18px; transform: translateY(-20px) scale(.97); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  #cc.open .panel { transform: none; }
  .toggles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 14px; }
  .tog { padding: 16px; border-radius: 22px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; font-size: 15px; }
  .tog.on { background: linear-gradient(135deg, #3d9bff, #0A84FF); }
  .slider-row { padding: 14px 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; border-radius: 22px; }
  .slider-row input { width: 100%; accent-color: #fff; }

  /* ---------- APP SHEET ---------- */
  #sheet { position: fixed; inset: 10px; z-index: 30; display: flex; flex-direction: column; overflow: hidden; border-radius: 34px;
    transform: scale(.85); opacity: 0; pointer-events: none; transition: transform .4s cubic-bezier(.2,.8,.2,1), opacity .3s ease; }
  #sheet.open { transform: none; opacity: 1; pointer-events: auto; }
  .sheet-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid rgba(255,255,255,.2); }
  .sheet-top h2 { font-size: 20px; font-weight: 700; }
  .close { width: 40px; height: 40px; border-radius: 50%; border: none; color: #fff; font-size: 18px; cursor: pointer; }
  #sheet-body { flex: 1; overflow-y: auto; padding: 18px; user-select: text; }
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-radius: 18px; margin-bottom: 10px; background: rgba(255,255,255,.1); font-size: 16px; }
  .list-item small { color: var(--text-dim); display: block; font-size: 13px; margin-top: 3px; }
  .big-time { font-size: 80px; font-weight: 200; text-align: center; margin: 30px 0 10px; }
  .big-date { text-align: center; color: var(--text-dim); font-size: 18px; }
  .chat { display: flex; flex-direction: column; gap: 10px; min-height: 60vh; }
  .bubble { padding: 12px 16px; border-radius: 20px; max-width: 80%; font-size: 15px; line-height: 1.4; }
  .bubble.me { align-self: flex-end; background: linear-gradient(135deg,#3d9bff,#0A84FF); }
  .bubble.ai { align-self: flex-start; background: rgba(255,255,255,.18); }
  .chat-input { display: flex; gap: 10px; margin-top: 12px; }
  .chat-input .field { flex: 1; }
  textarea.field { resize: vertical; min-height: 120px; }
  .calc-display { font-size: 48px; text-align: right; padding: 20px; min-height: 90px; }
  .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .calc-grid .btn { padding: 20px 0; font-size: 22px; border-radius: 24px; }
  .weather-big { font-size: 90px; text-align: center; }
  .temp { font-size: 64px; font-weight: 200; text-align: center; }
  .forecast { display: flex; justify-content: space-between; margin-top: 20px; }
  .forecast div { text-align: center; font-size: 14px; }
</style>
</head>
<body>
<div class="wallpaper" id="wallpaper"></div>

<!-- ============ SETUP ============ -->
<div id="setup" class="screen">
  <div class="glass card" id="setup-card"></div>
</div>

<!-- ============ HOME ============ -->
<div id="home" class="screen hidden">
  <div class="statusbar"><span id="sb-time"></span><span>5G &nbsp;▮▮▮</span></div>
  <div class="widgets">
    <div class="glass widget wide" onclick="openApp('clock')">
      <div class="label">Uhr</div>
      <div class="big" id="w-time">--:--</div>
      <div id="w-date" style="color:var(--text-dim)"></div>
    </div>
    <div class="glass widget" onclick="openApp('weather')">
      <div class="label">Wetter</div>
      <div class="big">14°</div>
      <div>Bewölkt · Wildeshausen</div>
    </div>
    <div class="glass widget" onclick="openApp('smarthome')">
      <div class="label">Zuhause</div>
      <div class="big" id="w-lights">2</div>
      <div>Lichter an</div>
    </div>
  </div>
  <div class="grid" id="app-grid"></div>
</div>

<div id="dock" class="dock glass hidden"></div>

<!-- ============ CONTROL CENTER ============ -->
<div id="cc" onclick="if(event.target===this)toggleCC()">
  <div class="glass panel">
    <div class="toggles">
      <div class="glass tog on" id="t-wifi" onclick="tog(this)">📶 WLAN</div>
      <div class="glass tog on" id="t-bt" onclick="tog(this)">🔵 Bluetooth</div>
      <div class="glass tog" id="t-dnd" onclick="tog(this)">🌙 Fokus</div>
      <div class="glass tog" id="t-air" onclick="tog(this)">✈️ Flugmodus</div>
    </div>
    <div class="glass slider-row"><span>☀️ Helligkeit</span><input type="range" min="10" max="100" value="80" oninput="document.getElementById('home').style.filter='brightness('+this.value/100+')'"></div>
    <div class="glass slider-row"><span>🔊 Lautstärke</span><input type="range" min="0" max="100" value="60"></div>
    <button class="btn" style="width:100%" onclick="resetSetup()">Einrichtung zurücksetzen</button>
  </div>
</div>

<!-- ============ APP SHEET ============ -->
<div id="sheet" class="glass">
  <div class="sheet-top">
    <h2 id="sheet-title"></h2>
    <button class="close glass" onclick="closeApp()">✕</button>
  </div>
  <div id="sheet-body"></div>
</div>

<script>
/* ============ STATE ============ */
const STORE = 'agenHub';
let state = JSON.parse(localStorage.getItem(STORE) || 'null') || {
  setup: false, name: '', wallpaper: 0, notes: '', lights: { 'Wohnzimmer': true, 'Küche': false, 'Schlafzimmer': false }
};
const save = () => localStorage.setItem(STORE, JSON.stringify(state));

const WALLPAPERS = [
  'radial-gradient(circle at 20% 15%,#ff7ab6,transparent 45%),radial-gradient(circle at 85% 25%,#5ac8fa,transparent 50%),radial-gradient(circle at 60% 90%,#ffd60a,transparent 45%),linear-gradient(160deg,#1b1f3b,#0b0d1a)',
  'radial-gradient(circle at 80% 10%,#34c759,transparent 50%),radial-gradient(circle at 10% 80%,#0a84ff,transparent 55%),linear-gradient(160deg,#0d1f14,#06080c)',
  'radial-gradient(circle at 30% 20%,#ff9f0a,transparent 50%),radial-gradient(circle at 80% 80%,#bf5af2,transparent 50%),linear-gradient(160deg,#2a0f1f,#0a0608)',
  'linear-gradient(160deg,#dfe6f5,#9fb3d9)'
];
function applyWallpaper() {
  document.getElementById('wallpaper').style.background = WALLPAPERS[state.wallpaper];
}

/* ============ SETUP FLOW ============ */
let setupStep = 0;
function renderSetup() {
  const card = document.getElementById('setup-card');
  const dots = `<div class="dots">${[0,1,2,3].map(i=>`<span class="${i===setupStep?'on':''}"></span>`).join('')}</div>`;
  if (setupStep === 0) {
    card.innerHTML = `<div class="logo">🏠</div><h1>Willkommen bei Agen</h1>
      <p>Dein persönlicher Home Hub für Zuhause, Apps und deinen Assistenten.</p>
      ${dots}<button class="btn primary" onclick="nextSetup()">Los geht's</button>`;
  } else if (setupStep === 1) {
    card.innerHTML = `<h1>Wie heißt du?</h1><p>Damit der Hub dich begrüßen kann.</p>
      <input class="field" id="sname" placeholder="Dein Name" value="${state.name}">
      ${dots}<button class="btn primary" onclick="state.name=document.getElementById('sname').value.trim()||'Freund';nextSetup()">Weiter</button>`;
  } else if (setupStep === 2) {
    card.innerHTML = `<h1>Wähle deinen Hintergrund</h1><p>Du kannst ihn später ändern.</p>
      <div class="wp-choices">${WALLPAPERS.map((w,i)=>`<div class="wp-choice ${i===state.wallpaper?'sel':''}" style="background:${w}" onclick="state.wallpaper=${i};renderSetup()"></div>`).join('')}</div>
      ${dots}<button class="btn primary" onclick="applyWallpaper();nextSetup()">Weiter</button>`;
  } else {
    card.innerHTML = `<h1>Alles bereit, ${state.name}!</h1><p>Dein Hub ist eingerichtet. Viel Freude mit Agen.</p>
      ${dots}<button class="btn primary" onclick="finishSetup()">Hub starten</button>`;
  }
}
function nextSetup() { setupStep++; renderSetup(); }
function finishSetup() {
  state.setup = true; save();
  document.getElementById('setup').classList.add('hidden');
  showHome();
}
function resetSetup() {
  if (!confirm('Einrichtung wirklich zurücksetzen?')) return;
  localStorage.removeItem(STORE); location.reload();
}

/* ============ HOME ============ */
const APPS = [
  { id:'clock',    name:'Uhr',         icon:'🕒', color:'' },
  { id:'weather',  name:'Wetter',      icon:'⛅', color:'' },
  { id:'calendar', name:'Kalender',    icon:'📅', color:'' },
  { id:'photos',   name:'Fotos',       icon:'🖼️', color:'' },
  { id:'music',    name:'Musik',       icon:'🎵', color:'' },
  { id:'messages', name:'Nachrichten', icon:'💬', color:'' },
  { id:'notes',    name:'Notizen',     icon:'📝', color:'' },
  { id:'calc',     name:'Rechner',     icon:'🧮', color:'' },
  { id:'smarthome',name:'Zuhause',     icon:'💡', color:'' },
  { id:'bluetooth',name:'Geräte',      icon:'🔵', color:'' },
  { id:'agent',    name:'Agen',        icon:'✨', color:'' },
  { id:'settings', name:'Einstellungen',icon:'⚙️', color:'' },
  { id:'camera',   name:'Kamera',      icon:'📷', color:'' },
  { id:'files',    name:'Dateien',     icon:'📁', color:'' },
  { id:'health',   name:'Gesundheit',  icon:'❤️', color:'' },
  { id:'store',    name:'Store',       icon:'🛍️', color:'' },
];
const DOCK = ['messages','calendar','photos','agent'];

function renderHome() {
  document.getElementById('app-grid').innerHTML = APPS.map(a =>
    `<div class="app" onclick="openApp('${a.id}')"><div class="icon glass-icon">${a.icon}</div><div class="name">${a.name}</div></div>`
  ).join('');
  document.getElementById('dock').innerHTML = DOCK.map(id => {
    const a = APPS.find(x=>x.id===id);
    return `<div class="app" onclick="openApp('${a.id}')"><div class="icon">${a.icon}</div></div>`;
  }).join('');
}
function showHome() {
  applyWallpaper();
  renderHome();
  document.getElementById('home').classList.remove('hidden');
  document.getElementById('dock').classList.remove('hidden');
  tickClock();
}
function tickClock() {
  const d = new Date();
  const t = d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('sb-time').textContent = t;
  document.getElementById('w-time').textContent = t;
  document.getElementById('w-date').textContent = d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
}
setInterval(tickClock, 15000);

/* ============ CONTROL CENTER ============ */
function toggleCC() { document.getElementById('cc').classList.toggle('open'); }
function tog(el) { el.classList.toggle('on'); }
// Wischen von oben rechts = Kontrollzentrum
let touchY = null;
document.addEventListener('touchstart', e => touchY = e.touches[0].clientY);
document.addEventListener('touchend', e => {
  if (touchY === null) return;
  const dy = e.changedTouches[0].clientY - touchY;
  if (touchY < 40 && dy > 60 && !document.getElementById('sheet').classList.contains('open')) toggleCC();
  touchY = null;
});

/* ============ APP SHEET ============ */
function openApp(id) {
  const app = APPS.find(a=>a.id===id);
  document.getElementById('sheet-title').textContent = app.name;
  document.getElementById('sheet-body').innerHTML = appContent(id);
  document.getElementById('sheet').classList.add('open');
  if (id==='smarthome' || id==='notes') {}
  if (id==='clock') startLiveClock();
}
function closeApp() {
  document.getElementById('sheet').classList.remove('open');
  clearInterval(clockTimer);
}

let clockTimer;
function startLiveClock() {
  const el = () => document.getElementById('live-clock');
  clearInterval(clockTimer);
  clockTimer = setInterval(() => {
    const d = new Date();
    if (el()) el().textContent = d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }, 1000);
}

function appContent(id) {
  switch(id) {
    case 'clock': return `
      <div class="big-time" id="live-clock"></div>
      <div class="big-date">${new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
      <div style="margin-top:30px">
        <div class="list-item">Weltzeit Tokio<small>+8 Std.</small> <span>${new Date().toLocaleTimeString('de-DE',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'})}</span></div>
        <div class="list-item">Weltzeit New York<small>−6 Std.</small> <span>${new Date().toLocaleTimeString('de-DE',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit'})}</span></div>
      </div>`;
    case 'weather': return `
      <div class="weather-big">⛅</div>
      <div class="temp">14°</div>
      <p style="text-align:center;color:var(--text-dim)">Bewölkt · Wildeshausen</p>
      <div class="forecast glass" style="padding:16px;border-radius:22px">
        <div>Sa<br>🌧️<br>11°</div><div>So<br>⛅<br>13°</div><div>Mo<br>☀️<br>16°</div><div>Di<br>🌦️<br>12°</div><div>Mi<br>☁️<br>10°</div>
      </div>
      <p style="margin-top:16px;color:var(--text-dim);font-size:13px">Beispieldaten. Für echtes Wetter kann später eine Wetter-API angebunden werden.</p>`;
    case 'calendar': return `
      <div class="list-item">Frühstück<small>09:00 · Heute</small></div>
      <div class="list-item">Projekt Agen Review<small>14:00 · Heute</small></div>
      <div class="list-item">Sport<small>18:30 · Morgen</small></div>
      <p style="color:var(--text-dim);font-size:13px;margin-top:10px">Beispieltermine. Eigene Termine können später gespeichert werden.</p>`;
    case 'photos': return `<div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px">
      ${WALLPAPERS.map(w=>`<div style="aspect-ratio:1;border-radius:16px;background:${w}"></div>`).join('')}</div>`;
    case 'music': return `
      <div class="glass" style="padding:24px;text-align:center">
        <div style="font-size:90px">🎵</div>
        <h3 style="margin-top:10px">Beispiel-Song</h3><p style="color:var(--text-dim)">Agen Playlist</p>
        <div style="display:flex;justify-content:center;gap:20px;margin-top:18px;font-size:30px">
          <span style="cursor:pointer" onclick="alert('Zurück')">⏮</span>
          <span style="cursor:pointer" onclick="alert('Abspielen')">▶️</span>
          <span style="cursor:pointer" onclick="alert('Weiter')">⏭</span>
        </div></div>`;
    case 'messages': return `
      <div class="chat">
        <div class="bubble ai">Hallo ${state.name}! Hier kannst du Nachrichten lesen und schreiben.</div>
        <div class="bubble me">Super, das Design gefällt mir.</div>
      </div>
      <div class="chat-input"><input class="field" placeholder="Nachricht"><button class="btn primary" onclick="alert('Gesendet (Demo)')">↑</button></div>`;
    case 'notes': return `
      <textarea class="field" id="notes-area" placeholder="Schreibe etwas…" oninput="state.notes=this.value;save()">${state.notes}</textarea>`;
    case 'calc': return `
      <div class="glass calc-display" id="calc-out">0</div>
      <div class="calc-grid" style="margin-top:14px">
        ${['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='].map(k=>
          `<button class="btn" onclick="calcKey('${k}')">${k}</button>`).join('')}
      </div>`;
    case 'smarthome': return `
      ${Object.keys(state.lights).map(room=>`
        <div class="list-item">💡 ${room}
          <input type="checkbox" ${state.lights[room]?'checked':''} onchange="state.lights['${room}']=this.checked;save();updateLights()" style="width:24px;height:24px;accent-color:#0A84FF">
        </div>`).join('')}
      <p style="color:var(--text-dim);font-size:13px;margin-top:10px">Demo-Schaltung. Echte Geräte kannst du über Geräte (Bluetooth) verbinden.</p>`;
    case 'bluetooth': return `
      <p style="color:var(--text-dim);margin-bottom:14px">Suche nach Bluetooth-Geräten in der Nähe. Funktioniert in Chrome auf Android.</p>
      <button class="btn primary" style="width:100%" onclick="scanBT()">Geräte suchen</button>
      <div id="bt-list" style="margin-top:16px"></div>`;
    case 'agent': return `
      <div class="chat" id="agent-chat">
        <div class="bubble ai">Hi ${state.name}, ich bin Agen. Was kann ich für dich tun?</div>
      </div>
      <div class="chat-input"><input class="field" id="agent-in" placeholder="Frag mich etwas" onkeydown="if(event.key==='Enter')askAgent()"><button class="btn primary" onclick="askAgent()">↑</button></div>`;
    case 'settings': return `
      <div class="list-item">Name<small>${state.name}</small></div>
      <div class="list-item" onclick="setupStep=1;document.getElementById('setup').classList.remove('hidden');renderSetup()">Einrichtung ändern</div>
      <div class="list-item">Hintergrund
        <div style="display:flex;gap:8px">${WALLPAPERS.map((w,i)=>`<div onclick="state.wallpaper=${i};save();applyWallpaper()" style="width:34px;height:34px;border-radius:50%;background:${w};cursor:pointer;border:2px solid ${i===state.wallpaper?'#fff':'transparent'}"></div>`).join('')}</div>
      </div>
      <div class="list-item">Version<small>Agen Home Hub 1.0</small></div>`;
    case 'camera': return `<div class="glass" style="height:300px;display:flex;align-items:center;justify-content:center;font-size:60px">📷</div>
      <p style="color:var(--text-dim);text-align:center;margin-top:10px;font-size:13px">Kamerazugriff über den Browser (Demo).</p>
      <button class="btn primary" style="width:100%;margin-top:14px" onclick="startCam()">Kamera starten</button>`;
    case 'files': return `<div class="list-item">📄 Dokument.pdf<small>12 KB</small></div><div class="list-item">🖼️ Bild.jpg<small>2 MB</small></div>`;
    case 'health': return `<div class="list-item">👟 Schritte<small>Heute</small> <span>6.420</span></div><div class="list-item">💤 Schlaf<small>Letzte Nacht</small> <span>7 h 40</span></div>`;
    case 'store': return `<div class="list-item">Agen Plugins<small>Demnächst</small></div><p style="color:var(--text-dim);font-size:13px">Hier können später weitere Apps installiert werden.</p>`;
  }
  return '';
}

function updateLights() {
  document.getElementById('w-lights').textContent = Object.values(state.lights).filter(Boolean).length;
}

/* ============ CALCULATOR ============ */
let calcVal = '0', calcOp = null, calcPrev = null, calcNew = true;
function calcKey(k) {
  const out = document.getElementById('calc-out');
  if ('0123456789'.includes(k) || k === '.') {
    calcVal = calcNew ? k : (calcVal === '0' && k !== '.' ? k : calcVal + k);
    calcNew = false;
  } else if (k === 'C') { calcVal='0'; calcPrev=null; calcOp=null; calcNew=true; }
  else if (k === '±') calcVal = String(-parseFloat(calcVal));
  else if (k === '%') calcVal = String(parseFloat(calcVal)/100);
  else if ('+−×÷'.includes(k)) { calcPrev = parseFloat(calcVal); calcOp = k; calcNew = true; }
  else if (k === '=') {
    const a = calcPrev, b = parseFloat(calcVal);
    let r = b;
    if (calcOp==='+') r=a+b; if (calcOp==='−') r=a-b; if (calcOp==='×') r=a*b; if (calcOp==='÷') r=b===0?'Fehler':a/b;
    calcVal = String(r); calcOp=null; calcNew=true;
  }
  out.textContent = calcVal;
}

/* ============ AGEN ASSISTANT (Demo-Antworten) ============ */
function askAgent() {
  const input = document.getElementById('agent-in');
  const text = input.value.trim();
  if (!text) return;
  const chat = document.getElementById('agent-chat');
  chat.insertAdjacentHTML('beforeend', `<div class="bubble me">${escapeHtml(text)}</div>`);
  input.value = '';
  setTimeout(() => {
    chat.insertAdjacentHTML('beforeend', `<div class="bubble ai">Demo-Antwort: Hier kann später dein eigenes KI-Modell angebunden werden. Du hast gesagt: „${escapeHtml(text)}“</div>`);
    chat.parentElement.scrollTop = 99999;
  }, 500);
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============ BLUETOOTH (Web Bluetooth, Chrome/Android) ============ */
async function scanBT() {
  const list = document.getElementById('bt-list');
  if (!navigator.bluetooth) {
    list.innerHTML = `<div class="list-item">Web Bluetooth nicht verfügbar.<small>Bitte Chrome auf Android nutzen.</small></div>`;
    return;
  }
  try {
    const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: ['battery_service','device_information'] });
    list.innerHTML = `<div class="list-item">${device.name || 'Unbekanntes Gerät'}<small>${device.id}</small></div>`;
    device.addEventListener('gattserverdisconnected', () => {
      list.insertAdjacentHTML('beforeend', `<div class="list-item">Verbindung getrennt</div>`);
    });
    const server = await device.gatt.connect();
    list.insertAdjacentHTML('beforeend', `<div class="list-item">Verbunden ✓<small>Bereit für Befehle</small></div>`);
  } catch (e) {
    list.innerHTML = `<div class="list-item">Abgebrochen<small>${e.message}</small></div>`;
  }
}

/* ============ CAMERA ============ */
async function startCam() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    document.getElementById('sheet-body').innerHTML = `<video autoplay playsinline style="width:100%;border-radius:22px"></video>`;
    document.querySelector('#sheet-body video').srcObject = stream;
  } catch (e) { alert('Kamera nicht verfügbar: ' + e.message); }
}

/* ============ START ============ */
applyWallpaper();
if (state.setup) {
  document.getElementById('setup').classList.add('hidden');
  showHome();
} else {
  renderSetup();
}
updateLights();
</script>
