<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Agen Home Hub</title>
<style>
:root{--accent:#0a84ff;--blur:34px;--is:1;--txt:#fff;--dim:rgba(255,255,255,.68);
  --font:"Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body.light{--txt:#111;--dim:rgba(0,0,0,.55)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:var(--font);color:var(--txt);user-select:none;-webkit-user-select:none}
input,textarea,select{user-select:text;-webkit-user-select:text;color:var(--txt)}
svg{display:block;flex:none}

/* ---------- Bühne (skaliert sich auf jede Größe) ---------- */
#stage{position:fixed;left:50%;top:50%;overflow:hidden;transform-origin:50% 50%}
#wall{position:absolute;inset:0;background-size:cover;background-position:center;transition:background .6s}
.wp0{background:radial-gradient(120% 80% at 75% 0%,#f0b68a,transparent 60%),radial-gradient(90% 70% at 0% 100%,#c97b55,transparent 70%),linear-gradient(#b5764f,#6e4130)}
.wp1{background:radial-gradient(110% 70% at 80% 0%,#4f8bff,transparent 55%),radial-gradient(100% 80% at 10% 100%,#1b2262,transparent 70%),linear-gradient(#1c2352,#070916)}
.wp2{background:radial-gradient(100% 70% at 20% 0%,#ff9d74,transparent 55%),radial-gradient(90% 80% at 100% 100%,#b24d86,transparent 60%),linear-gradient(#2b1a33,#120a16)}
.wp3{background:radial-gradient(100% 70% at 50% 0%,#f4f6fb,transparent 60%),linear-gradient(#cfd8e8,#8e9bb6)}

/* ---------- Liquid Glass ---------- */
.glass{position:relative;overflow:hidden;border-radius:var(--r,28px);
  background:linear-gradient(160deg,rgba(255,255,255,.30),rgba(255,255,255,.07));
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%);
  box-shadow:0 14px 40px rgba(0,0,0,.22),inset 0 0 0 1px rgba(255,255,255,.2),inset 0 1.5px 0 rgba(255,255,255,.55)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.16) 47%,transparent 60%)}
body.light .glass{background:linear-gradient(160deg,rgba(255,255,255,.7),rgba(255,255,255,.4))}
.dark{background:linear-gradient(160deg,rgba(18,22,38,.6),rgba(18,22,38,.3))!important}

/* ---------- Bedienelemente ---------- */
.pill{border:0;border-radius:999px;color:#fff;font:inherit;font-weight:600;font-size:17px;padding:14px 24px;cursor:pointer;
  background:linear-gradient(160deg,rgba(255,255,255,.38),rgba(255,255,255,.10));
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 16px rgba(0,0,0,.2);transition:transform .15s}
.pill:active{transform:scale(.96)}
.pill.blue{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000))}
.ibtn{border:0;background:none;color:var(--txt);cursor:pointer;padding:6px;border-radius:50%}
.ibtn:active{opacity:.5}
.ibtn.big{background:rgba(255,255,255,.2);padding:14px;border-radius:50%}
.switch{width:52px;height:32px;border-radius:999px;background:rgba(120,120,128,.55);position:relative;flex:none;transition:background .25s;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .25s}
.switch.on{background:#34c759}.switch.on::after{transform:translateX(20px)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.chk.on{background:var(--accent);border-color:var(--accent)}
.field{width:100%;padding:14px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);font:inherit;font-size:17px;outline:none}
body.light .field{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.12)}
.field::placeholder{color:var(--dim)}
.addrow{display:flex;gap:10px;margin-bottom:14px;align-items:stretch}
.addrow .field{flex:1;min-width:0}
.seg{display:flex;background:rgba(255,255,255,.14);border-radius:16px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;color:var(--txt);padding:11px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:rgba(255,255,255,.34)}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;margin-bottom:10px;background:rgba(255,255,255,.12);font-size:17px}
.row small{display:block;color:var(--dim);font-size:13px;margin-top:3px}
.row input[type=range]{width:220px;accent-color:var(--accent)}
.rcard{padding:16px 18px;margin-bottom:12px;--r:24px}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.rcard input[type=range]{width:100%;margin-top:12px;accent-color:var(--accent)}
.rowc{display:flex;align-items:center;gap:10px}
.chev{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:var(--txt);cursor:pointer;display:flex;align-items:center;justify-content:center}
.chev:active{transform:scale(.92)}
.tval{font-size:30px;font-weight:300;min-width:80px;text-align:center}
.note{color:var(--dim);font-size:14px;margin:12px 4px;line-height:1.45}
.sec{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin:20px 4px 8px}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:var(--accent)}
.sw{width:34px;height:34px;border-radius:50%;cursor:pointer;display:inline-block;border:2px solid rgba(255,255,255,.4)}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cbtn{height:72px;border:0;border-radius:22px;font:inherit;font-size:26px;color:#fff;background:rgba(255,255,255,.2);cursor:pointer}
.cbtn.op{background:var(--accent)}
.cbtn:active{opacity:.6}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.wpthumb{aspect-ratio:1;border-radius:22px;cursor:pointer;border:3px solid transparent;background-size:cover}
.wpthumb.sel{border-color:#fff}
.art{margin:10px auto 20px;width:180px;height:180px;border-radius:44px;background:linear-gradient(160deg,#ff375f,#bf2b5a);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.ctrl{display:flex;justify-content:center;gap:26px;align-items:center}
.chatbox{min-height:420px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.bubble{padding:12px 16px;border-radius:20px;max-width:78%;font-size:16px;line-height:1.4}
.bubble.me{align-self:flex-end;background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000))}
.bubble.ai{align-self:flex-start;background:rgba(255,255,255,.18)}
.big{font-size:110px;font-weight:200;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-3px;margin:14px 0 4px}
.hide{display:none!important}

/* ---------- Einrichtung ---------- */
#setup{position:absolute;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:30px}
#setup .card{--r:36px;width:min(480px,100%);padding:40px 30px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
#setup h1{font-size:30px;font-weight:700;letter-spacing:-.5px}
#setup p{color:var(--dim);font-size:17px;line-height:1.45}
.wp-row{display:flex;gap:14px}
.wp-pick{width:62px;height:62px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.wp-pick.sel{border-color:#fff}
.dots{display:flex;gap:7px}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}.dots i.on{background:#fff}

/* ---------- Sperrbildschirm ---------- */
#lock{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;padding-top:12%;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s}
#lock.gone{transform:translateY(-100%);opacity:0;pointer-events:none}
.lock-time{font-size:190px;font-weight:300;letter-spacing:-6px;line-height:.95;font-variant-numeric:tabular-nums;text-shadow:0 2px 24px rgba(0,0,0,.2)}
.lock-date{margin-top:10px;font-size:26px;font-weight:500;text-shadow:0 1px 10px rgba(0,0,0,.2)}
.lock-foot{position:absolute;bottom:50px;left:0;right:0;text-align:center;font-size:16px;color:rgba(255,255,255,.85)}
.lock-foot i{display:block;margin:0 auto 12px;width:46px;height:5px;border-radius:5px;background:rgba(255,255,255,.75)}

/* ---------- Startseite ---------- */
#status{position:absolute;top:14px;left:44px;right:44px;height:32px;display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:600;z-index:5;font-variant-numeric:tabular-nums}
#status .ico{display:flex;gap:10px;align-items:center}
#pages{position:absolute;left:0;right:0;top:56px;bottom:150px;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;scroll-snap-align:start;padding:18px 44px;height:100%;overflow-y:auto;scrollbar-width:none}
.wg{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:170px;gap:18px}
.w{--r:32px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .15s}
.w:active{transform:scale(.98)}
.w .lbl{font-size:17px;font-weight:600}
.w .lbl small{display:block;font-size:14px;color:var(--dim);font-weight:500;margin-top:3px}
.w-therm{grid-column:1/3;grid-row:1/3;cursor:default}
.tbig{font-size:170px;font-weight:200;letter-spacing:-8px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.w-clock{grid-column:3/5;grid-row:1;flex-direction:row;align-items:center;gap:24px}
.w-clock .face{width:130px;height:130px;flex:none}
.dig{font-size:72px;font-weight:300;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1}
.dtxt{font-size:18px;color:var(--dim);margin-top:8px}
.w-wx{grid-column:3;grid-row:2}
.w-int{grid-column:4;grid-row:2}
.wxt{font-size:52px;font-weight:200;letter-spacing:-2px}
.scenes{grid-column:1/5;grid-row:3;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.tile{--r:28px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile.on{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000))}
.apps{display:grid;grid-template-columns:repeat(var(--cols,6),1fr);gap:28px 14px;justify-items:center;padding-top:10px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;width:116px}
.app .ic{width:calc(96px*var(--is));height:calc(96px*var(--is));border-radius:calc(24px*var(--is));display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.12),0 8px 18px rgba(0,0,0,.25);transition:transform .15s}
.app .ic svg{width:calc(50px*var(--is));height:calc(50px*var(--is))}
.app:active .ic{transform:scale(.9)}
.app .nm{font-size:15px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.5);text-align:center;white-space:nowrap}
#dots{position:absolute;left:0;right:0;bottom:132px;display:flex;justify-content:center;gap:9px;z-index:5}
#dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35)}
#dots i.on{background:#fff}
.dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:18px;padding:14px 20px;--r:40px;z-index:20}
.dock .app{width:auto}
.dock .app .ic{width:calc(88px*var(--is));height:calc(88px*var(--is));border-radius:calc(22px*var(--is))}
.dock .app .nm{display:none}

/* ---------- Kontrollzentrum ---------- */
#cc{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .3s}
#cc.open{opacity:1;pointer-events:auto}
#cc .panel{--r:36px;position:absolute;top:14px;right:14px;width:440px;padding:18px;display:flex;flex-direction:column;gap:14px;
  transform:translateY(-16px) scale(.97);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#cc.open .panel{transform:none}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc-tile{--r:26px;padding:18px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:17px;cursor:pointer}
.cc-tile.on{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000))}
.cc-sl{--r:26px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600}
.cc-sl input{width:100%;accent-color:#fff}
.cc-mini{--r:26px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ---------- App-Fenster ---------- */
#sheet{position:absolute;inset:14px;z-index:40;display:flex;flex-direction:column;--r:40px;
  transform:scale(.92);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s}
#sheet.open{transform:none;opacity:1;pointer-events:auto}
.sheet-top{display:flex;align-items:center;justify-content:space-between;padding:20px 26px;border-bottom:1px solid rgba(255,255,255,.18);position:relative;z-index:1}
.sheet-top h2{font-size:26px;font-weight:700}
.x{width:44px;height:44px;border-radius:50%;border:0;color:var(--txt);font-size:20px;cursor:pointer;background:rgba(255,255,255,.2)}
#sheet-body{flex:1;overflow-y:auto;padding:22px 26px 36px;position:relative;z-index:1}

/* ---------- Benachrichtigung ---------- */
#toast{position:absolute;left:50%;top:-80px;transform:translateX(-50%);z-index:95;padding:14px 26px;border-radius:999px;font-weight:600;font-size:17px;transition:top .35s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
#toast.show{top:30px}
</style>
</head>
<body>
<div id="stage">
  <div id="wall" class="wp0"></div>

  <!-- Einrichtung -->
  <div id="setup" class="hide"><div class="glass card" id="setup-card"></div></div>

  <!-- Sperrbildschirm -->
  <div id="lock" class="hide">
    <div class="lock-time" id="lk-time">--:--</div>
    <div class="lock-date" id="lk-date"></div>
    <div class="lock-foot"><i></i>Nach oben wischen zum Öffnen</div>
  </div>

  <!-- Startseite -->
  <div id="status"><span id="sb-time"></span><span class="ico" id="sb-ico"></span></div>
  <div id="pages"></div>
  <div id="dots"></div>
  <div id="dock" class="dock glass hide"></div>

  <!-- Kontrollzentrum -->
  <div id="cc" onclick="if(event.target===this)toggleCC(false)">
    <div class="glass panel" id="cc-panel"></div>
  </div>

  <!-- App-Fenster -->
  <div id="sheet" class="glass dark">
    <div class="sheet-top">
      <h2 id="sheet-title"></h2>
      <button class="x" onclick="closeApp()" aria-label="schließen">✕</button>
    </div>
    <div id="sheet-body"></div>
  </div>

  <div id="toast" class="glass"></div>
</div>

<script>
/* ============ Hilfsfunktionen ============ */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2300);}
function speak(t){if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';speechSynthesis.speak(u);}}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

/* ============ Zustand ============ */
const KEY='agenHub4';
const DEF={setup:false,name:'',wp:0,custom:null,accent:'#0a84ff',blur:34,is:1,h24:true,unit:'C',light:false,
  agenUrl:'',vol:0.6,city:'Wildeshausen',heatMode:'Heizen',doorLocked:true,
  cc:{wifi:true,bt:true,focus:false,plane:false},
  rooms:[{n:'Wohnzimmer',on:true,b:80,t:21},{n:'Küche',on:false,b:60,t:20},{n:'Schlafzimmer',on:false,b:40,t:18}],
  notes:[],todos:[],shop:[],events:[],alarms:[],contacts:[],steps:{},sleep:[],chat:[],btDevices:[],ilog:[]};
const clone=o=>JSON.parse(JSON.stringify(o));
function load(){try{return Object.assign(clone(DEF),JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){return clone(DEF);}}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Speicher voll – Bild evtl. zu groß');}}

/* ============ Icons (eigene Linien-Icons) ============ */
const P={
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
cloud:'<path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.5 3.5 0 0 0 7 18z"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="3.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
check:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12.5l3 3 5-6"/>',
note:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/>',
calc:'<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7.5h8M8 12h1M12 12h1M16 12h1M8 16h1M12 16h1M16 16h1"/>',
photo:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="9.5" r="1.8"/><path d="M4 18l5.5-5.5 4 4 2.5-2.5L20 18"/>',
music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1V17h5v-1c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
therm:'<path d="M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z"/>',
cam:'<rect x="3" y="7" width="13" height="11" rx="2.5"/><path d="M16 10.5l5-3v9l-5-3"/>',
wave:'<path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/>',
bt:'<path d="M7 7l10 10-5 5V2l5 5L7 17"/>',
spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
cart:'<path d="M3 4h2l2.4 11h10.2L20 7H7"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
lock:'<rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
minus:'<path d="M5 12h14"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
prev:'<path d="M19 4l-10 8 10 8zM5 4h2v16H5z"/>',
next:'<path d="M5 4l10 8-10 8zM17 4h2v16h-2z"/>',
play:'<path d="M7 4l13 8-13 8z"/>',
pause:'<path d="M7 4h4v16H7zM13 4h4v16h-4z"/>',
wifi:'<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="#fff"/>',

function fit(){

  const W=portrait?800:1280, H=portrait?1280:800;
  const st=$('stage');
  st.style.width=W+'px'; st.style.height=H+'px';

}

/* ============ Uhr / Zeit ============ */
function timeStr(d){return d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',hour12:!S.h24});}
function fmtMs(ms){const s=Math.floor(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60);}
function clockFace(){
  let s='<svg viewBox="-50 -50 100 100" class="face">';
  for(let i=0;i<12;i++) s+=`<line y1="-44" y2="${i%3?-40:-38}" transform="rotate(${i*30})" stroke="#fff" stroke-width="${i%3?1.2:2.6}" stroke-linecap="round"/>`;
  s+=`<line id="hh" y1="4" y2="-22" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>`;
  s+=`<line id="mh" y1="6" y2="-34" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>`;
  s+=`<line id="sh" y1="10" y2="-40" stroke="#ff453a" stroke-width="1"/><circle r="2.4" fill="#fff"/></svg>`;
  return s;
}
function tick(){
  const d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();
  const t=timeStr(d);
  $('sb-time').textContent=t;
  $('lk-time').textContent=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  $('lk-date').textContent=d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
  const hh=$('hh');
  if(hh){
    hh.setAttribute('transform',`rotate(${(h%12)*30+m*0.5})`);
    $('mh').setAttribute('transform',`rotate(${m*6+s*0.1})`);
    $('sh').setAttribute('transform',`rotate(${s*6})`);
  }
  if($('dig')) $('dig').textContent=t;
  if($('dtxt')) $('dtxt').textContent=d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
  // Wecker
  const key=pad(h)+':'+pad(m);
  if(s===0 && LAST_ALARM!==key){
    LAST_ALARM=key;
    S.alarms.forEach(a=>{ if(a.on && a.t===key){ toast('Wecker: '+(a.l||a.t)); speak(a.l||'Wecker'); } });
  }
  // Timer
  if(TM.end){
    const left=TM.end-Date.now();
    if(left<=0){ TM.end=0; TM.rem=0; toast('Timer abgelaufen'); speak('Timer abgelaufen'); if(CUR==='clock') refresh(); }
    if($('tm-disp')) $('tm-disp').textContent=fmtMs(Math.max(0,left));
  }
  // Stoppuhr
  if($('sw-disp')) $('sw-disp').textContent=fmtMs(SW.acc+(SW.run?Date.now()-SW.start:0));
}
setInterval(tick,1000);

function setBright(v){S.bright=+v;save();$('stage').style.filter=`brightness(${v/100})`;}
function setVol(v){S.vol=v/100;MUS.a.volume=S.vol;save();}

/* ============ Sperren / Entsperren ============ */
function lockScreen(first){
  toggleCC(false);
  closeApp();
  $('lock').classList.remove('hide','gone');
  $('pages').classList.add('hide');$('dots').classList.add('hide');$('dock').classList.add('hide');
  $('status').classList.add('hide');
}
function unlock(){
  if(!$('lock').classList.contains('hide')&&!$('lock').classList.contains('gone')){
    $('lock').classList.add('gone');
    setTimeout(()=>$('lock').classList.add('hide'),500);
    ['pages','dots','dock','status'].forEach(id=>$(id).classList.remove('hide'));
    renderHome();
  }
}

/* ============ Wischgesten ============ */
let g=null;
document.addEventListener('pointerdown',e=>{g={x:e.clientX,y:e.clientY};});
document.addEventListener('pointerup',e=>{
  if(!g) return;
  const dx=e.clientX-g.x, dy=e.clientY-g.y;
  const locked=!$('lock').classList.contains('hide')&&!$('lock').classList.contains('gone');
  if(locked){ if(dy<-60 && Math.abs(dy)>Math.abs(dx)) unlock(); }
  else if(g.y<60 && dy>60 && g.x>innerWidth*0.4) toggleCC(true);
  g=null;
});
$('lock').addEventListener('click',()=>{ if(S.setup) unlock(); });
addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeApp();toggleCC(false);}
  if(CUR==='calc' && $('sheet').classList.contains('open')) calcKey(e.key);
});

/* ---- Uhr ---- */
let CLOCK_TAB='time';
V.clock=()=>{
  const tabs=[['time','Uhrzeit'],['alarm','Wecker'],['timer','Timer'],['sw','Stoppuhr']];
  const bar=`<div class="seg">${tabs.map(([k,n])=>`<button class="${CLOCK_TAB===k?'on':''}" onclick="CLOCK_TAB='${k}';refresh()">${n}</button>`).join('')}</div>`;
  if(CLOCK_TAB==='time'){
    const d=new Date();
    return bar+`<div class="big" id="dig">${timeStr(d)}</div><p class="note" style="text-align:center">${d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
      <div class="sec">Weltzeit</div>
      <div class="row">Tokio<span>${new Date().toLocaleTimeString('de-DE',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'})}</span></div>
      <div class="row">New York<span>${new Date().toLocaleTimeString('de-DE',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit'})}</span></div>
      <div class="row">London<span>${new Date().toLocaleTimeString('de-DE',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit'})}</span></div>`;
  }
  if(CLOCK_TAB==='alarm'){
    return bar+`<div class="addrow"><input type="time" class="field" id="al-t" value="07:00"><input class="field" id="al-l" placeholder="Bezeichnung"><button class="pill blue" onclick="addAlarm()">${ic('plus',22)}</button></div>`+
      (S.alarms.map((a,i)=>`<div class="row"><div><b>${a.t}</b><small>${esc(a.l||'Wecker')}</small></div><div style="display:flex;gap:12px;align-items:center"><div class="switch ${a.on?'on':''}" onclick="togAlarm(${i})"></div><button class="ibtn" onclick="delAlarm(${i})">${ic('trash',22)}</button></div></div>`).join('')||'<p class="note">Keine Wecker.</p>');
  }
  if(CLOCK_TAB==='timer'){
    const left=TM.end?Math.max(0,TM.end-Date.now()):TM.rem;
    return bar+`<div class="big" id="tm-disp">${fmtMs(left)}</div>
      <div class="seg" style="margin-top:20px"><button onclick="tmSet(1)">1 Min</button><button onclick="tmSet(5)">5 Min</button><button onclick="tmSet(15)">15 Min</button></div>
      <div class="ctrl"><button class="pill blue" onclick="tmStart()">${TM.end?'Pause':'Start'}</button><button class="pill" onclick="tmReset()">Zurücksetzen</button></div>`;
  }
  if(CLOCK_TAB==='sw'){
    return bar+`<div class="big" id="sw-disp">${fmtMs(SW.acc+(SW.run?Date.now()-SW.start:0))}</div>
      <div class="ctrl"><button class="pill blue" onclick="swToggle()">${SW.run?'Stopp':'Start'}</button><button class="pill" onclick="swReset()">Zurücksetzen</button></div>`;
  }
  return bar;
};
function addAlarm(){const t=$('al-t').value,l=$('al-l').value.trim();if(!t)return;S.alarms.push({t,l,on:true});save();refresh();}
function togAlarm(i){S.alarms[i].on=!S.alarms[i].on;save();refresh();}
function delAlarm(i){S.alarms.splice(i,1);save();refresh();}
let TMDUR=5*60*1000;
function tmSet(min){TMDUR=min*60*1000;TM.rem=TMDUR;TM.end=0;refresh();}
function tmStart(){
  if(TM.end){TM.rem=Math.max(0,TM.end-Date.now());TM.end=0;}
  else{ if(!TM.rem) TM.rem=TMDUR; TM.end=Date.now()+TM.rem; }
  refresh();
}

function swToggle(){

/* ---- Rechner ---- */
V.calc=()=>`<div class="glass" style="--r:26px;padding:22px;text-align:right;font-size:72px;font-weight:300;min-height:130px;word-break:break-all;margin-bottom:16px" id="cdisp">${esc(CALC.e||'0')}</div>
  <div class="cgrid">${['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','%','0','.','='].map(k=>`<button class="cbtn ${'÷×−+='.includes(k)?'op':''}" onclick="calcKey('${k}')">${k}</button>`).join('')}</div>`;
function calcKey(k){
  const map={'/':'÷','*':'×','-':'−','Enter':'=','=':'=','Backspace':'⌫','Escape':'C'};
  if(/^[0-9.()+%]$/.test(k)) k=k; else if(map[k]) k=map[k]; else return;
  if(k==='C'){CALC.e='';}
  else if(k==='⌫'){CALC.e=CALC.e.slice(0,-1);}
  else if(k==='='){
    try{
      const x=CALC.e.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');
      if(!/^[\d+\-*/().\s/]+$/.test(x)) throw 0;
      const r=Function('return ('+x+')')();
      CALC.e=String(Number.isFinite(r)?+r.toFixed(10):'Fehler');
    }catch(e){CALC.e='Fehler';}
  }
  else{ if(CALC.e==='Fehler') CALC.e=''; CALC.e+=k; }
  if(CUR==='calc') refresh();
}

V.photos=()=>`<div class="pgrid">${WPS.map((w,i)=>`<div class="wpthumb ${w} ${!S.custom&&S.wp===i?'sel':''}" onclick="setWP(${i})"></div>`).join('')}${S.custom?`<div class="wpthumb sel" style="background-image:url(${S.custom})" onclick="setWP(-1)"></div>`:''}</div>

  <p class="note">Das Foto wird verkleinert und im Browser gespeichert.</p>`;
function setWP(i){if(i<0)return;S.custom=null;S.wp=i;save();applyTheme();refresh();}
function pickPhoto(input){
  const f=input.files[0]; if(!f) return;
  const img=new Image();
  img.onload=()=>{
    const sc=Math.min(1,1280/img.width);
    const c=document.createElement('canvas');
    c.width=img.width*sc;c.height=img.height*sc;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    S.custom=c.toDataURL('image/jpeg',0.82);
    save();applyTheme();refresh();toast('Hintergrund gesetzt');
  };
  img.src=URL.createObjectURL(f);
  input.value='';
}

V.camera=()=>`<div class="glass" style="--r:28px;height:380px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:16px">
  <video id="cv" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;display:none"></video>

  <div style="display:flex;gap:12px"><button class="pill blue" style="flex:1" onclick="camStart()">Starten</button><button class="pill" style="flex:1" onclick="camShot()">Foto</button><button class="pill" onclick="camStop()">Stopp</button></div>`;
async function camStart(){
  try{
    CAM=await navigator.mediaDevices.getUserMedia({video:true});
    const v=$('cv'); v.srcObject=CAM; v.style.display='block'; $('cph').style.display='none';
  }catch(e){toast('Kamera nicht verfügbar');}
}
function camShot(){
  const v=$('cv'); if(!CAM||!v) return toast('Erst Kamera starten');
  const c=document.createElement('canvas');c.width=v.videoWidth||1280;c.height=v.videoHeight||720;
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  const a=document.createElement('a');a.href=c.toDataURL('image/jpeg',0.92);a.download='foto-'+Date.now()+'.jpg';a.click();
  toast('Foto gespeichert');
}
function camStop(){
  if(CAM){CAM.getTracks().forEach(t=>t.stop());CAM=null;}
  const v=$('cv'); if(v){v.style.display='none';}
  const p=$('cph'); if(p) p.style.display='';
}

/* ---- Geräte (Bluetooth) ---- */
V.devices=()=>`<button class="pill blue" style="width:100%" onclick="scanBT()">Geräte in der Nähe suchen</button>
  <p class="note">Bluetooth LE über Chrome auf Android. Handys koppelst du in den Android-Einstellungen, nicht hier.</p>
  ${S.btDevices.map((d,i)=>`<div class="row"><div><b>${esc(d.n)}</b><small>${d.connected?'Verbunden':'Gespeichert'}${d.batt!=null?' · Akku '+d.batt+' %':''}</small></div><button class="pill" onclick="forgetBT(${i})">Entfernen</button></div>`).join('')}`;
async function scanBT(){
  if(!navigator.bluetooth) return toast('Bluetooth nicht verfügbar (Chrome Android nötig)');
  try{
    const d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['battery_service']});
    const entry={n:d.name||'Unbekanntes Gerät',id:d.id,connected:false,batt:null};
    S.btDevices=S.btDevices.filter(x=>x.id!==d.id);S.btDevices.push(entry);
    d.addEventListener('gattserverdisconnected',()=>{entry.connected=false;save();refresh();});
    const server=await d.gatt.connect();
    entry.connected=true;
    try{const svc=await server.getPrimaryService('battery_service');const ch=await svc.getCharacteristic('battery_level');const val=await ch.readValue();entry.batt=val.getUint8(0);}catch(e){}
    save();refresh();toast('Verbunden');
  }catch(e){toast('Verbindung abgebrochen');}
}
function forgetBT(i){S.btDevices.splice(i,1);save();refresh();}

V.agen=()=>`<div class="chatbox">${S.chat.map(m=>`<div class="bubble ${m.r==='me'?'me':'ai'}">${esc(m.t)}</div>`).join('')||`<div class="bubble ai">Hi ${esc(S.name||'Freund')}, was kann ich tun?</div>`}</div>
  <div class="addrow"><input class="field" id="ain" placeholder="Frag etwas oder sag: Licht aus" onkeydown="if(event.key==='Enter')askAgent()"><button class="pill blue" onclick="askAgent()">${ic('spark',22)}</button></div>
  <p class="note">Steuert Lichter, Heizung und Uhrzeit. Für freie Fragen einen Endpunkt in den Einstellungen eintragen.</p>`;
async function askAgent(){
  const i=$('ain'); const q=i.value.trim(); if(!q) return;
  i.value='';
  S.chat.push({r:'me',t:q}); S.chat=S.chat.slice(-60); save(); refresh();
  const a=await respond(q);
  S.chat.push({r:'ai',t:a}); S.chat=S.chat.slice(-60); save(); refresh();
  setTimeout(()=>{const c=$('ain');if(c)c.focus();},50);
}
async function respond(q){
  const l=q.toLowerCase();
  if(/licht.*(aus|off)|alles aus/.test(l)){S.rooms.forEach(r=>r.on=false);save();updateWidgets();return 'Alle Lichter sind aus.';}
  if(/licht.*(an|ein|on)/.test(l)){S.rooms.forEach(r=>r.on=true);save();return 'Alle Lichter sind an.';}
  const m=l.match(/(\d{1,2})\s*(grad|°)/);
  if(m){const n=clamp(+m[1],10,30);S.rooms[0].t=n;save();updateWidgets();return `Ich stelle die Heizung im ${S.rooms[0].n} auf ${n} °C.`;}
  if(/wie spät|uhrzeit|wie viel uhr/.test(l)) return 'Es ist '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr.';
  if(/wetter/.test(l)){const w=WX[S.city]||WX.Wildeshausen;return `${S.city}: ${w.t} °C, ${w.c.toLowerCase()} (Beispieldaten).`;}
  if(S.agenUrl){
    try{
      const r=await fetch(S.agenUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});
      const txt=await r.text();
      try{const j=JSON.parse(txt);return j.reply||j.text||txt;}catch(e){return txt;}
    }catch(e){return 'Der Endpunkt antwortet nicht: '+e.message;}
  }
  return 'Ich kann Lichter, Heizung und Uhrzeit steuern. Für freie Fragen trage in den Einstellungen einen Endpunkt ein.';
}

  <div class="sec">Uhr & Einheiten</div>
  <div class="row"><div>24-Stunden-Format</div><div class="switch ${S.h24?'on':''}" onclick="setPref('h24',!S.h24)"></div></div>
  <div class="row"><div>Temperatur</div><div class="seg" style="margin:0;width:180px"><button class="${S.unit==='C'?'on':''}" onclick="setPref('unit','C')">°C</button><button class="${S.unit==='F'?'on':''}" onclick="setPref('unit','F')">°F</button></div></div>
  <div class="sec">Geräte & Assistent</div>
  <div class="row" style="flex-direction:column;align-items:stretch"><div>Endpunkt für freie Fragen<small>Optional, z. B. die URL deines Modells</small></div>
    <input class="field" style="margin-top:10px" value="${esc(S.agenUrl)}" placeholder="https://..." onchange="setPref('agenUrl',this.value.trim(),true)"></div>
  <div class="sec">Daten</div>
  <div class="row" style="cursor:pointer" onclick="exportData()"><div>Sicherung exportieren</div></div>
  <label class="row" style="cursor:pointer"><div>Sicherung importieren</div><input type="file" accept="application/json" hidden onchange="importData(this)"></label>
  <div class="row" style="cursor:pointer" onclick="resetAll()"><div style="color:#ff453a">Alles zurücksetzen</div></div>
  <div class="sec">Info</div>
  <div class="row"><div>Version<small>Agen Home Hub 2.0</small></div></div>`;
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='agen-sicherung.json';a.click();
}
function importData(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{try{S=Object.assign(clone(DEF),JSON.parse(r.result));save();applyTheme();renderHome();refresh();toast('Sicherung geladen');}catch(e){toast('Datei ungültig');}};
  r.readAsText(f);
}
function resetAll(){if(confirm('Alle Daten löschen und neu einrichten?')){localStorage.removeItem(KEY);location.reload();}}

/* ============ Start ============ */
fit();
applyTheme();
tick();
if(!S.setup){
  renderSetup();
  $('setup').classList.remove('hide');
  $('lock').classList.add('hide');
}else{
  renderHome();
  lockScreen();
}
</script>
</body>
</html>
